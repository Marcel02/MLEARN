  {t:R`Es la evidencia: un factor de normalización, \(\sum_if(\bx|\omega_i)\Pr(\omega_i)\), igual para todas las clases.`, ok:1, fb:R`Por eso no influye al comparar clases. Hace que las posteriores sumen 1.`},

  {t:R`Es la probabilidad de error de la regla.`, fb:R`\(f(\bx)\) es una densidad, no una probabilidad de error.`}]},

 {id:'b2q1', q:R`¿Qué decide la regla MAP en \(\bx\)?`, opts:[
  {t:R`La clase con mayor verosimilitud \(f(\bx|\omega_i)\).`, fb:R`Eso es ML. Coincide con MAP solo si las priors son iguales.`},
  {t:R`La clase con mayor prior \(\Pr(\omega_i)\).`, fb:R`Eso solo ocurre si la observación no aporta información (verosimilitudes iguales).`},

  {t:R`La clase de menor coste esperado con costes arbitrarios.`, fb:R`Esa es MBR. MAP es MBR con costes 0-1.`}]},

  {t:R`Porque \(\Pr(e)=\int\Pr(e|\bx)f(\bx)\,d\bx\) con \(f(\bx)\ge0\), y MAP hace mínimo \(\Pr(e|\bx)=1-\max_i\Pr(\omega_i|\bx)\) en cada \(\bx\).`, ok:1, fb:R`Minimizar el integrando punto a punto minimiza la integral. Es el ejercicio 1.`},

  {t:R`…da siempre una frontera lineal.`, fb:R`La forma de la frontera depende de las pdf, no de las priors.`}]},
 {id:'b2q5', q:R`¿En cuál de estos problemas la diapositiva 16 sugiere que el error mínimo <strong>no</strong> es un buen criterio?`, opts:[
  {t:R`Diagnóstico médico: decir «sano» a un enfermo no cuesta lo mismo que lo contrario.`, ok:1, fb:R`Los dos errores tienen consecuencias muy distintas. Hace falta asignar costes (MBR).`},
  {t:R`Cualquier problema con dos clases equiprobables y errores igual de graves.`, fb:R`Ahí MAP es justo lo adecuado.`},
  {t:R`Ninguno: el error mínimo siempre es el mejor criterio.`, fb:R`La diapositiva pregunta justamente eso, y la respuesta es que no siempre.`},
  {t:R`Problemas en los que las pdf son gaussianas.`, fb:R`La forma de las pdf no tiene que ver con lo que cuesta equivocarse.`}]}
],
b3: [
 {id:'b3q1', q:R`En el riesgo de Bayes \(\mathcal R=\sum_i\sum_j\pi_{ij}\Pr(\omega_i|\omega_j)\Pr(\omega_j)\), ¿qué es \(\pi_{12}\)?`, opts:[
  {t:R`El coste de decidir \(\omega_2\) cuando la clase real es \(\omega_1\).`, fb:R`Al revés: el primer índice es la decisión.`},
  {t:R`El coste de decidir \(\omega_1\) cuando la clase real es \(\omega_2\).`, ok:1, fb:R`\(\pi_{ij}\) acompaña a \(\Pr(\omega_i|\omega_j)\) = «decidir \(\omega_i\) siendo \(\omega_j\)».`},
  {t:R`La probabilidad de confundir las clases 1 y 2.`, fb:R`\(\pi_{ij}\) es un coste que elige el diseñador, no una probabilidad.`},
  {t:R`El coste de acertar la clase 1.`, fb:R`Ese sería \(\pi_{11}\).`}]},
 {id:'b3q2', q:R`Con \(c=2\), ¿cuál es la regla MBR?`, opts:[
  {t:R`\(\dfrac{\Pr(\omega_1|\bx)}{\Pr(\omega_2|\bx)}\ \underset{\omega_2}{\overset{\omega_1}{\gtrless}}\ \dfrac{\pi_{12}-\pi_{22}}{\pi_{21}-\pi_{11}}=\gamma\)`, ok:1, fb:R`Sale de \(\mathcal C(\omega_1|\bx)\lt\mathcal C(\omega_2|\bx)\), agrupando términos y dividiendo (suponiendo \(\pi_{21}>\pi_{11}\)).`},
  {t:R`\(\dfrac{\Pr(\omega_1|\bx)}{\Pr(\omega_2|\bx)}\ \underset{\omega_2}{\overset{\omega_1}{\gtrless}}\ \dfrac{\pi_{21}-\pi_{11}}{\pi_{12}-\pi_{22}}\)`, fb:R`Es el umbral invertido. Si decidir mal \(\omega_1\) es caro (\(\pi_{21}\) grande), \(\gamma\) debe bajar para que \(\mathcal R_1\) crezca.`},
  {t:R`\(\Pr(\omega_1|\bx)\gtrless\Pr(\omega_2|\bx)\), sin umbral.`, fb:R`Eso es MAP (\(\gamma=1\)).`},
  {t:R`\(f(\bx|\omega_2)/f(\bx|\omega_1)\ge\gamma\), con \(\gamma\) elegido para fijar \(P_{FA}\).`, fb:R`Eso es Neyman-Pearson.`}]},
 {id:'b3q3', q:R`\(\pi_{11}=\pi_{22}=0\), \(\pi_{12}=1\), \(\pi_{21}=4\). ¿A partir de qué valor de \(\Pr(\omega_1|\bx)\) decide MBR \(\omega_1\)?`, opts:[
  {t:R`\(0{,}5\)`, fb:R`Ese es el umbral de MAP (costes iguales).`},
  {t:R`\(0{,}8\)`, fb:R`Sería con los costes intercambiados (\(\gamma=4\)).`},
  {t:R`\(0{,}25\)`, fb:R`\(0{,}25\) es \(\gamma\), que es un umbral sobre el <em>cociente</em>, no sobre la posterior.`},
  {t:R`\(0{,}2\)`, ok:1, fb:R`\(\gamma=1/4\). \(\frac{P}{1-P}>\frac14\iff P>\frac{\gamma}{1+\gamma}=\frac15\). Equivocarse con \(\omega_1\) cuesta 4 veces más, así que se decide \(\omega_1\) con menos evidencia.`}]},
 {id:'b3q4', q:R`¿Con qué costes MBR se convierte en MAP y, además, su riesgo \(\mathcal R\) pasa a ser exactamente \(\Pr(e)\)?`, opts:[
  {t:R`\(\pi_{ii}=1\) y \(\pi_{ij}=0\) para \(i\ne j\).`, fb:R`Premiaría los errores.`},
  {t:R`Costes 0-1: \(\pi_{ii}=0\) y \(\pi_{ij}=1\) para \(i\ne j\).`, ok:1, fb:R`Entonces \(\mathcal C(\omega_i|\bx)=1-\Pr(\omega_i|\bx)\), y minimizarlo es maximizar la posterior. El riesgo pasa a ser \(\Pr(e)\).`},
  {t:R`Cualquier matriz simétrica.`, fb:R`Con \(\pi_{12}=\pi_{21}=5\) y diagonal nula se decide como MAP (\(\gamma=1\)), pero el riesgo es \(5\Pr(e)\); y con \(\pi_{11}\ne\pi_{22}\), \(\gamma\ne1\) en general.`},
  {t:R`Nunca: MBR y MAP son reglas distintas.`, fb:R`MAP es un caso particular de MBR (diap. 22).`}]},
 {id:'b3q5', q:R`Demostración del teorema MBR (diap. 19): ¿por qué basta con asignar cada \(\bx\) a la clase de menor riesgo condicional?`, opts:[
  {t:R`Porque \(\mathcal R=\sum_i\int_{\mathcal R_i}\mathcal C(\omega_i|\bx)f(\bx)\,d\bx\): cada \(\bx\) aporta el riesgo de la región en la que cae, y \(f(\bx)\ge0\).`, ok:1, fb:R`Poniendo cada \(\bx\) en la región de menor \(\mathcal C\), el integrando es mínimo en todo punto.`},
  {t:R`Porque el riesgo condicional es siempre menor que 1.`, fb:R`Con costes arbitrarios puede ser mayor que 1, y además eso no prueba nada.`},
  {t:R`Porque las regiones \(\mathcal R_i\) se solapan.`, fb:R`Son disjuntas por construcción: cada \(\bx\) recibe una sola decisión.`},
  {t:R`Porque las priors se cancelan.`, fb:R`No se cancelan: están dentro de las posteriores de \(\mathcal C(\omega_i|\bx)\).`}]}
],
b4: [
 {id:'b4q1', q:R`¿Cuándo se usa Neyman-Pearson en lugar de MAP o MBR?`, opts:[
  {t:R`Cuando no se conocen las priors (o no tiene sentido darlas), como en un radar.`, ok:1, fb:R`¿Cuál es la «probabilidad a priori» de que aparezca un avión enemigo? NP solo usa las verosimilitudes.`},
  {t:R`Cuando las pdf no son gaussianas.`, fb:R`NP vale para cualquier pdf; lo que no necesita son las priors.`},
  {t:R`Cuando hay más de dos clases.`, fb:R`NP se plantea para dos hipótesis.`},
  {t:R`Cuando todos los errores cuestan lo mismo.`, fb:R`Eso apunta a MAP.`}]},
 {id:'b4q2', q:R`El detector de Neyman-Pearson…`, opts:[
  {t:R`…minimiza \(P_{FA}\) sin restricciones.`, fb:R`Sin restricción, \(P_{FA}=0\) se consigue decidiendo siempre \(\omega_1\) (con \(P_D=0\)).`},
  {t:R`…maximiza \(P_D\) sujeto a \(P_{FA}\le\alpha\); decide \(\omega_2\) si \(f(\bx|\omega_2)/f(\bx|\omega_1)\ge\gamma\).`, ok:1, fb:R`El Lagrangiano \(\int_{\mathcal R_2}(f_2-\gamma f_1)\,d\bx+\gamma\alpha\) se maximiza metiendo en \(\mathcal R_2\) los \(\bx\) con \(f_2-\gamma f_1\ge0\).`},
  {t:R`…decide \(\omega_1\) si \(f(\bx|\omega_2)/f(\bx|\omega_1)\ge\gamma\).`, fb:R`Es la errata de la diap. 25 que el profesor corrige a mano: es \(\omega_2\).`},
  {t:R`…usa \(\gamma=1\) siempre.`, fb:R`\(\gamma\) se ajusta para cumplir \(P_{FA}=\alpha\).`}]},
 {id:'b4q3', q:R`\(\omega_1:\ x\sim\mathcal N(0,1)\), \(\omega_2:\ x\sim\mathcal N(2,1)\), \(\alpha=0{,}05\). El detector NP decide \(\omega_2\) si \(x\ge\gamma'\). ¿Cuánto valen \(\gamma'\) y \(P_D\)?`, opts:[
  {t:R`\(\gamma'=1\), \(P_D=0{,}841\).`, fb:R`Con \(\gamma'=1\), \(P_{FA}=Q(1)=0{,}159>0{,}05\): incumple la restricción.`},
  {t:R`\(\gamma'=1{,}96\), \(P_D=0{,}516\).`, fb:R`\(1{,}96\) deja 2,5 % en una cola; aquí la restricción es de una cola al 5 %.`},
  {t:R`\(\gamma'=Q^{-1}(0{,}05)\approx1{,}645\), \(P_D=Q(1{,}645-2)\approx0{,}639\).`, ok:1, fb:R`\(P_{FA}=Q(\gamma')=0{,}05\Rightarrow\gamma'=1{,}645\); \(P_D=\Pr(x\ge\gamma'|\omega_2)=Q(\gamma'-2)=Q(-0{,}355)=0{,}639\).`},
  {t:R`\(\gamma'=1{,}645\), \(P_D=0{,}95\).`, fb:R`\(0{,}95\) es \(1-P_{FA}\), el rechazo correcto.`}]},
 {id:'b4q4', q:R`¿Qué busca el criterio minimax?`, opts:[
  {t:R`Minimizar el peor riesgo posible cuando las priors son desconocidas o cambian: el riesgo resultante no depende de \(\Pr(\omega_1)\).`, ok:1, fb:R`Se elige la frontera que anula el coeficiente de \(\Pr(\omega_1)\) en \(\mathcal R\). Es la recta horizontal tangente al máximo de la curva (diap. 28).`},
  {t:R`Maximizar \(P_D\) con \(P_{FA}\) fija.`, fb:R`Eso es NP.`},
  {t:R`Minimizar \(\Pr(e)\) con las priors conocidas.`, fb:R`Eso es MAP.`},
  {t:R`Igualar los costes \(\pi_{12}\) y \(\pi_{21}\).`, fb:R`Los costes los da el problema; minimax actúa sobre las regiones.`}]},
 {id:'b4q5', q:R`Con costes 0-1, la condición minimax queda en…`, opts:[
  {t:R`\(\int_{\mathcal R_2}f(\bx|\omega_1)\,d\bx=\int_{\mathcal R_1}f(\bx|\omega_2)\,d\bx\): las dos probabilidades de error condicionadas iguales.`, ok:1, fb:R`Con \(\pi_{11}=\pi_{22}=0\) y \(\pi_{12}=\pi_{21}=1\), anular el coeficiente de \(\Pr(\omega_1)\) da \(P_{FA}=P_{\text{miss}}\).`},
  {t:R`\(\Pr(\omega_1)=\Pr(\omega_2)=\tfrac12\).`, fb:R`Minimax no fija las priors; busca una frontera válida para todas.`},
  {t:R`\(P_D=1\).`, fb:R`No es alcanzable salvo con clases separables.`},
  {t:R`\(\gamma=0\).`, fb:R`Con \(\gamma=0\) se decidiría siempre la misma clase.`}]}
],
b5: [
 {id:'b5q1', q:R`¿Qué diferencia hay entre un clasificador generativo y uno discriminativo?`, opts:[
  {t:R`El generativo modela \(f(\bx|\omega_i)\) y \(\Pr(\omega_i)\) y aplica Bayes; el discriminativo aprende directamente la frontera o \(\Pr(\omega_i|\bx)\).`, ok:1, fb:R`QDA, LDA y Naive Bayes son generativos (diap. 30).`},
  {t:R`El generativo solo vale para dos clases.`, fb:R`Vale para \(c\) clases.`},
  {t:R`El discriminativo necesita conocer las priors.`, fb:R`Al contrario: no modela las priors por separado.`},
  {t:R`Son lo mismo con distinto nombre.`, fb:R`Difieren en qué se modela.`}]},
 {id:'b5q2', q:R`\(x\sim\mathcal N(\mu,\sigma^2)\). ¿Cuánto vale \(\Pr(x>\mu+2\sigma)\)?`, opts:[
  {t:R`\(2{,}5\,\%\)`, fb:R`Es lo que pone la figura de la diap. 32, pero corresponde a \(1{,}96\sigma\).`},
  {t:R`\(Q(2)\approx2{,}28\,\%\)`, ok:1, fb:R`Tipificando, \(\Pr(z>2)=Q(2)=0{,}02275\).`},
  {t:R`\(5\,\%\)`, fb:R`Eso es aproximadamente la suma de las dos colas (\(4{,}55\,\%\)).`},
  {t:R`\(16\,\%\)`, fb:R`Esa es \(Q(1)\), la cola a \(1\sigma\).`}]},
 {id:'b5q3', q:R`\(\bC=\begin{pmatrix}2&1\\1&2\end{pmatrix}=\bU\bLambda\bU^T\) con \(\lambda_1=3\), \(\lambda_2=1\). Con \(\bA=\bU\bLambda^{-1/2}\), \(\bz=\bA^T\bx\) tiene covarianza…`, opts:[
  {t:R`\(\bLambda=\mathrm{diag}(3,1)\)`, fb:R`Eso da \(\bU^T\bx\) (solo rotar). Falta escalar cada eje por \(1/\sqrt{\lambda_i}\).`},
  {t:R`\(\mathbf I\)`, ok:1, fb:R`\(\bA^T\bC\bA=\bLambda^{-1/2}\bU^T\bU\bLambda\bU^T\bU\bLambda^{-1/2}=\mathbf I\), con \(\bLambda^{-1/2}=\mathrm{diag}(1/\sqrt3,1)\).`},
  {t:R`\(\bLambda^2=\mathrm{diag}(9,1)\)`, fb:R`Saldría si se usara la errata de la diap. 35 (\(\sqrt{\lambda_i}\) en vez de \(1/\sqrt{\lambda_i}\)).`},
  {t:R`\(\bC\)`, fb:R`Una transformación lineal \(\bA^T\) cambia la covarianza a \(\bA^T\bC\bA\).`}]},
 {id:'b5q4', q:R`Clases gaussianas con covarianzas distintas \(\bC_1\ne\bC_2\). La frontera MAP es \(\bx^T\bA\bx+\bv^T\bx+e=0\) con…`, opts:[
  {t:R`\(\bA=\tfrac12(\bC_2^{-1}-\bC_1^{-1})\): una cuádrica (elipse, parábola, hipérbola… en 2D).`, ok:1, fb:R`El término \(-\frac12\bx^T\bC_i^{-1}\bx\) no se cancela al restar discriminantes. Su forma depende de los signos de los autovalores de \(\bA\).`},
  {t:R`\(\bA=\mathbf 0\): un hiperplano.`, fb:R`Solo si \(\bC_1=\bC_2\) (LDA).`},
  {t:R`\(\bA=\bC_1+\bC_2\): siempre una elipse.`, fb:R`Intervienen las inversas, y la forma puede ser también una hipérbola.`},
  {t:R`\(\bA=\tfrac12(\bmu_2-\bmu_1)(\bmu_2-\bmu_1)^T\).`, fb:R`Las medias entran en \(\bv\) y \(e\), no en \(\bA\).`}]},
 {id:'b5q5', q:R`En 2D, los autovalores de \(\bA\) son \(0{,}4\) y \(-0{,}3\). La frontera es…`, opts:[
  {t:R`…una elipse.`, fb:R`Para una elipse, los dos autovalores deben tener el mismo signo.`},
  {t:R`…una recta.`, fb:R`Requiere \(\bA=\mathbf 0\).`},
  {t:R`…una hipérbola (o un par de rectas en el caso degenerado).`, ok:1, fb:R`Signos opuestos: en los ejes propios, \(0{,}4u^2-0{,}3v^2+\dots=0\). Es lo que pasa siempre en el ejercicio 7.3.`},
  {t:R`…una parábola.`, fb:R`Requiere un autovalor nulo.`}]},
 {id:'b5q6', q:R`¿Por qué se toma el logaritmo para definir \(g_i(\bx)=\ln f(\bx|\omega_i)+\ln\Pr(\omega_i)\)?`, opts:[
  {t:R`Porque cambia la decisión y la hace más robusta.`, fb:R`No la cambia: el logaritmo es creciente.`},
  {t:R`Porque es creciente (no altera el argmax) y elimina la exponencial de la gaussiana.`, ok:1, fb:R`Cualquier función estrictamente creciente de la posterior da la misma regla. El logaritmo deja formas cuadráticas.`},
  {t:R`Porque las densidades pueden ser negativas.`, fb:R`Las densidades son no negativas.`},
  {t:R`Porque es necesario para que las priors sumen 1.`, fb:R`Las priors suman 1 por definición.`}]}
],
b6: [
 {id:'b6q1', q:R`Si todas las clases comparten la misma covarianza \(\bC\), la frontera MAP entre dos clases es…`, opts:[
  {t:R`…un hiperplano \(\bw^T(\bx-\bx_0)=0\) con \(\bw=\bC^{-1}(\bmu_i-\bmu_j)\).`, ok:1, fb:R`El término cuadrático \(\bx^T\bC^{-1}\bx\) es igual en ambas clases y se cancela: LDA.`},
  {t:R`…una elipse centrada en \(\tfrac12(\bmu_i+\bmu_j)\).`, fb:R`Con covarianzas iguales no queda término cuadrático.`},
  {t:R`…siempre perpendicular a \(\bmu_i-\bmu_j\).`, fb:R`Solo si \(\bC\propto\mathbf I\). En general, la normal es \(\bC^{-1}(\bmu_i-\bmu_j)\).`},
  {t:R`…independiente de las priors.`, fb:R`Las priors desplazan \(\bx_0\) (diap. 45–46).`}]},
 {id:'b6q2', q:R`1D, \(\sigma^2=1\), \(\mu_i=0\), \(\mu_j=2\), \(\Pr(\omega_i)=0{,}8\), \(\Pr(\omega_j)=0{,}2\). ¿Dónde está la frontera MAP?`, opts:[
  {t:R`\(x_0=1\)`, fb:R`Sería con priors iguales.`},
  {t:R`\(x_0=1-\tfrac{\ln4}{2}\approx0{,}307\)`, fb:R`Sería desplazarla hacia la clase más probable; es al revés.`},
  {t:R`\(x_0=1+\tfrac{\ln4}{2}\approx1{,}693\)`, ok:1, fb:R`\(x_0=\frac12(\mu_i+\mu_j)-\frac{\ln(0{,}8/0{,}2)}{(\mu_i-\mu_j)^2/\sigma^2}(\mu_i-\mu_j)=1+\frac{2\ln4}{4}\). \(\mathcal R_i\) crece porque \(\omega_i\) es más probable.`},
  {t:R`\(x_0=-2\)`, fb:R`Es lo que daría la fórmula con la errata de la diap. 44.`}]},
 {id:'b6q3', q:R`Caso 3 (\(\bC=\sigma^2\mathbf I\), priors iguales). La regla MAP equivale a…`, opts:[
  {t:R`…asignar \(\bx\) a la media más cercana en distancia euclídea.`, ok:1, fb:R`\(g_i=-\|\bx-\bmu_i\|^2/(2\sigma^2)+\text{cte}\): clasificador de mínima distancia.`},
  {t:R`…asignar \(\bx\) a la media más lejana.`, fb:R`El signo menos hace que gane la más cercana.`},
  {t:R`…usar la distancia de Mahalanobis con una covarianza distinta por clase.`, fb:R`Eso sería QDA.`},
  {t:R`…decidir siempre la clase más probable.`, fb:R`Las priors son iguales; decide la distancia.`}]},
 {id:'b6q4', q:R`¿Qué es la distancia de Mahalanobis \((\bx-\bmu_i)^T\bC^{-1}(\bx-\bmu_i)\)?`, opts:[
  {t:R`La distancia euclídea al cuadrado.`, fb:R`Solo coincide si \(\bC=\mathbf I\).`},
  {t:R`La distancia euclídea en el espacio blanqueado, que pondera cada dirección con su varianza.`, ok:1, fb:R`Con \(\bz=\bLambda^{-1/2}\bU^T\bx\), queda \(\|\bz-\bmu_{z,i}\|^2\). Las direcciones de mucha varianza cuentan menos.`},
  {t:R`Una medida que solo vale en 1D.`, fb:R`Vale en cualquier dimensión.`},
  {t:R`El determinante de \(\bC\).`, fb:R`El determinante aparece en la normalización, no en la distancia.`}]},
 {id:'b6q5', q:R`Variables binarias independientes, \(p_i=\Pr(x_i=1|\omega_1)\), \(q_i=\Pr(x_i=1|\omega_2)\). El discriminante \(h(\bx)=\ln\Pr(\omega_1|\bx)-\ln\Pr(\omega_2|\bx)\) es…`, opts:[
  {t:R`…cuadrático en \(\bx\).`, fb:R`Como \(x_i\in\{0,1\}\), los exponentes \(x_i\) y \(1-x_i\) dejan términos lineales tras tomar logaritmos.`},
  {t:R`…lineal: \(\sum_ix_i\ln\frac{p_i(1-q_i)}{q_i(1-p_i)}+\sum_i\ln\frac{1-p_i}{1-q_i}+\ln\frac{\Pr(\omega_1)}{\Pr(\omega_2)}\).`, ok:1, fb:R`Diap. 50 y ejercicio 5.1: las clases gaussianas no son las únicas con discriminante lineal óptimo.`},
  {t:R`…constante.`, fb:R`Depende de \(\bx\) salvo que \(p_i=q_i\) para todo \(i\).`},
  {t:R`…no definido porque \(\bx\) es discreto.`, fb:R`Se trabaja con probabilidades en lugar de densidades, y todo sigue igual.`}]}
],
b7: [
 {id:'b7q1', q:R`¿Qué hace el estimador ML?`, opts:[
  {t:R`Elige los parámetros que maximizan \(f(\mathcal D_i|\boldsymbol\theta_i)=\prod_kf(\bx_{k,i}|\boldsymbol\theta_i)\), tratándolos como deterministas.`, ok:1, fb:R`Con muestras independientes, la verosimilitud es un producto, y se maximiza su logaritmo.`},
  {t:R`Trata los parámetros como variables aleatorias con una prior.`, fb:R`Esa es la estimación bayesiana (diap. 52).`},
  {t:R`Maximiza la probabilidad de error.`, fb:R`Maximiza la verosimilitud de los datos.`},
  {t:R`Usa los datos de test.`, fb:R`Se estima con el entrenamiento, clase por clase.`}]},
 {id:'b7q2', q:R`Muestras \(x_k\sim\mathcal N(\mu,\sigma^2)\), \(N=5\), \(\sigma^2=2\). ¿Cuánto vale \(E\{\hat\sigma^2_{ML}\}\) con \(\hat\sigma^2_{ML}=\frac1N\sum_k(x_k-\hat\mu)^2\)?`, opts:[
  {t:R`\(2\)`, fb:R`Sería así si se dividiera por \(N-1\), o si se conociera \(\mu\).`},
  {t:R`\(1{,}6\)`, ok:1, fb:R`\(E\{\hat\sigma^2_{ML}\}=\frac{N-1}N\sigma^2=\frac45\cdot2=1{,}6\). Está sesgado por haber usado \(\hat\mu\) en vez de \(\mu\).`},
  {t:R`\(2{,}5\)`, fb:R`El sesgo es hacia abajo, no hacia arriba.`},
  {t:R`\(0{,}4\)`, fb:R`\(0{,}4\) es el sesgo, \(\sigma^2/N\).`}]},
 {id:'b7q3', q:R`El estimador ML es asintóticamente eficiente. Eso significa que…`, opts:[
  {t:R`…es insesgado para cualquier \(N\).`, fb:R`Solo es asintóticamente insesgado (\(\hat\sigma^2_{ML}\) tiene sesgo con \(N\) finito).`},
  {t:R`…para \(N\) grande, su varianza alcanza la mínima posible (la cota de Cramér-Rao).`, ok:1, fb:R`Es la propiedad 2 de la diap. 58.`},
  {t:R`…se calcula muy rápido.`, fb:R`«Eficiente» se refiere a la varianza, no al coste de cálculo.`},
  {t:R`…su varianza no depende de \(N\).`, fb:R`La varianza disminuye con \(N\) (por ejemplo, \(\sigma^2/N\) para la media).`}]},
 {id:'b7q4', q:R`10 vectores binarios de una clase; la componente \(k\) vale 1 en 3 de ellos. ¿Cuál es la estimación ML de \(p_k\)?`, opts:[
  {t:R`\(0{,}5\)`, fb:R`No se usan los datos.`},
  {t:R`\(0{,}3\)`, ok:1, fb:R`\(\hat p_k=\frac1N\sum_jx_{k,j}=3/10\): la frecuencia relativa (diap. 60).`},
  {t:R`\(3\)`, fb:R`Es el recuento; falta dividir por \(N\).`},
  {t:R`\(0{,}7\)`, fb:R`Es la frecuencia de ceros.`}]},
 {id:'b7q5', q:R`En la implementación de LDA (diap. 61), ¿qué covarianza se usa?`, opts:[
  {t:R`Una por clase, \(\hat\bC_k\).`, fb:R`Eso es QDA.`},
  {t:R`La ponderada \(\hat\bC=\frac1N\sum_kN_k\hat\bC_k\), común a todas las clases.`, ok:1, fb:R`La manuscrita de la p. 75 escribe la media simple \(\frac1c\sum\hat\bC_j\), que solo coincide si los \(N_k\) son iguales.`},
  {t:R`La identidad.`, fb:R`Eso es el caso 3 (euclídeo), no LDA general.`},
  {t:R`La covarianza de todos los datos sin separar por clases.`, fb:R`Esa incluye la dispersión entre medias. LDA usa la intra-clase.`}]}
],
b8: [
 {id:'b8q1', q:R`¿Cuándo no se puede aplicar QDA aunque sí LDA?`, opts:[
  {t:R`Cuando alguna clase tiene \(N_k\le d\) muestras, pero el total \(N\) es suficiente.`, ok:1, fb:R`\(\hat\bC_k\) tiene rango como mucho \(N_k-1\) y es singular, pero la covarianza común se estima con todos los datos.`},
  {t:R`Cuando las clases son gaussianas.`, fb:R`QDA supone justamente clases gaussianas.`},
  {t:R`Cuando hay más muestras que dimensiones.`, fb:R`Ese es el caso fácil.`},
  {t:R`Nunca: QDA siempre es aplicable.`, fb:R`Necesita invertir \(\hat\bC_k\).`}]},
 {id:'b8q2', q:R`En RDA, \(\hat\bC_k(\alpha)=\alpha\hat\bC_k+(1-\alpha)\hat\bC\). ¿Qué dan \(\alpha=1\) y \(\alpha=0\)?`, opts:[
  {t:R`\(\alpha=1\): LDA; \(\alpha=0\): QDA.`, fb:R`Al revés.`},
  {t:R`\(\alpha=1\): QDA; \(\alpha=0\): LDA.`, ok:1, fb:R`Con \(\alpha=1\) queda la covarianza de cada clase; con \(\alpha=0\), la común.`},
  {t:R`Ambos dan Naive Bayes.`, fb:R`Naive Bayes es diagonal; RDA no fuerza la diagonal.`},
  {t:R`Ambos dan la identidad.`, fb:R`Eso lo haría el segundo parámetro, \(\gamma=1\), y aun así con escala \(\hat\sigma^2\).`}]},
 {id:'b8q3', q:R`¿Por qué \((1-\gamma)\hat\bC_k(\alpha)+\gamma\hat\sigma^2\mathbf I\) es invertible para \(\gamma>0\)?`, opts:[
  {t:R`Porque sus autovalores son \((1-\gamma)\lambda_i+\gamma\hat\sigma^2>0\).`, ok:1, fb:R`Sumar un múltiplo de \(\mathbf I\) desplaza todos los autovalores sin cambiar los autovectores.`},
  {t:R`Porque \(\hat\sigma^2\) es siempre 1.`, fb:R`\(\hat\sigma^2=\frac1d\tr\) depende de los datos.`},
  {t:R`Porque se vuelve diagonal.`, fb:R`No se vuelve diagonal salvo con \(\gamma=1\).`},
  {t:R`No lo es en general.`, fb:R`Sí lo es: es definida positiva.`}]},
 {id:'b8q4', q:R`¿Qué supone Naive Bayes?`, opts:[
  {t:R`Que las clases son equiprobables.`, fb:R`Las priors se estiman como frecuencias.`},
  {t:R`Que las características son independientes dentro de cada clase: \(f(\bx|\omega)=\prod_jf(x_j|\omega)\).`, ok:1, fb:R`Basta con estimar \(d\) densidades unidimensionales por clase.`},
  {t:R`Que las características son gaussianas con covarianza completa.`, fb:R`Si fueran gaussianas, la covarianza sería diagonal.`},
  {t:R`Que hay una sola característica.`, fb:R`Vale para cualquier \(d\).`}]},
 {id:'b8q5', q:R`Con \(d=100\) y gaussianas, ¿cuántos parámetros de covarianza por clase estima Naive Bayes frente a QDA?`, opts:[
  {t:R`100 frente a 10 000`, fb:R`QDA estima una matriz simétrica: \(d(d+1)/2\), no \(d^2\).`},
  {t:R`100 frente a 5050`, ok:1, fb:R`Diagonal: \(d=100\). Completa simétrica: \(\frac{100\cdot101}{2}=5050\).`},
  {t:R`1 frente a 100`, fb:R`Una sola varianza común sería el caso isotrópico.`},
  {t:R`Los mismos`, fb:R`La reducción es justamente la ventaja de Naive Bayes.`}]}
],
b9: [
 {id:'b9q1', q:R`Con umbral \(\gamma'\) (decidir \(\omega_2\) si \(x\ge\gamma'\)), ¿qué es la probabilidad de falsa alarma?`, opts:[
  {t:R`\(\Pr(x\ge\gamma'|\omega_2)\)`, fb:R`Esa es \(P_D\) (sensibilidad, recall).`},
  {t:R`\(\Pr(x\ge\gamma'|\omega_1)\)`, ok:1, fb:R`Decidir «hay blanco» cuando no lo hay.`},
  {t:R`\(\Pr(x\le\gamma'|\omega_2)\)`, fb:R`Esa es la pérdida (miss).`},
  {t:R`\(\Pr(\omega_1|x\ge\gamma')\)`, fb:R`Esa es una posterior: \(1-\) precisión.`}]},
 {id:'b9q2', q:R`¿Qué relación hay entre las cuatro probabilidades?`, opts:[
  {t:R`\(P_D+P_{FA}=1\)`, fb:R`Están condicionadas a clases distintas: no tienen por qué sumar 1.`},
  {t:R`\(P_D+P_{\text{miss}}=1\) y \(P_{FA}+P_{\text{CR}}=1\)`, ok:1, fb:R`Cada par está condicionado a la misma clase y cubre las dos decisiones.`},
  {t:R`Las cuatro suman 1.`, fb:R`Suman 2: dos pares que suman 1 cada uno.`},
  {t:R`\(P_D=P_{\text{CR}}\) siempre.`, fb:R`Solo en casos simétricos concretos.`}]},
 {id:'b9q3', q:R`Dos gaussianas de igual varianza con \(D'=|\mu_2-\mu_1|/\sigma=2\). ¿Cuánto vale el área bajo la ROC?`, opts:[
  {t:R`\(0{,}5\)`, fb:R`Corresponde a \(D'=0\) (clasificador aleatorio).`},
  {t:R`\(1-Q(\sqrt2)\approx0{,}921\)`, ok:1, fb:R`\(\text{AUROC}=1-Q(D'/\sqrt2)\): la probabilidad de que una muestra de \(\omega_2\) supere a una de \(\omega_1\), y la diferencia es \(\mathcal N(D',2)\).`},
  {t:R`\(1-Q(2)\approx0{,}977\)`, fb:R`Falta dividir por \(\sqrt2\).`},
  {t:R`\(1\)`, fb:R`Solo con clases perfectamente separables (\(D'\to\infty\)).`}]},
 {id:'b9q4', q:R`¿Qué representa la diagonal de la gráfica ROC (\(P_D=P_{FA}\))?`, opts:[
  {t:R`El clasificador ideal.`, fb:R`El ideal pasa por la esquina \((0,1)\).`},
  {t:R`Un clasificador que no discrimina (\(D'=0\)): decidir al azar.`, ok:1, fb:R`Si las dos pdf coinciden, cualquier umbral da la misma probabilidad de cruzarlo en ambas clases.`},
  {t:R`El punto de Neyman-Pearson.`, fb:R`NP es un punto de la curva con \(P_{FA}=\alpha\).`},
  {t:R`El mejor umbral.`, fb:R`No es un umbral concreto, sino un tipo de clasificador.`}]},
 {id:'b9q5', q:R`¿Qué mide la precisión?`, opts:[
  {t:R`\(\frac{TP}{TP+FN}\): de los enfermos, cuántos detecto.`, fb:R`Eso es el recall (sensibilidad).`},
  {t:R`\(\frac{TP}{TP+FP}\): de los que diagnostico como positivos, cuántos lo son.`, ok:1, fb:R`Estima \(\Pr(\omega_2|\bx\in\mathcal R_2)\), una posterior, y depende de la prevalencia.`},
  {t:R`\(\frac{TN}{TN+FP}\)`, fb:R`Esa es la especificidad.`},
  {t:R`\(\frac{TP+TN}{N}\)`, fb:R`Esa es la exactitud (accuracy).`}]}
],
b10: [
 {id:'b10q1', q:R`Sensibilidad 0,997, especificidad 0,985, prevalencia 0,001. ¿Cuánto vale \(\Pr(\text{sick}|+)\)?`, opts:[
  {t:R`\(0{,}997\)`, fb:R`Es la sensibilidad, \(\Pr(+|\text{sick})\). Es el error de confundir las dos condicionadas.`},
  {t:R`\(0{,}985\)`, fb:R`Es la especificidad.`},
  {t:R`\(\approx0{,}062\)`, ok:1, fb:R`\(\frac{0{,}997\cdot0{,}001}{0{,}015\cdot0{,}999+0{,}997\cdot0{,}001}=\frac{0{,}000997}{0{,}015982}=0{,}062\). Hay unos 15 falsos positivos por cada verdadero.`},
  {t:R`\(0{,}5\)`, fb:R`No hay razón para la equiprobabilidad: la prior es muy pequeña.`}]},
 {id:'b10q2', q:R`Tras el primer positivo, \(\Pr(\text{sick}|+)=0{,}062\). Un segundo test independiente, también positivo, da…`, opts:[
  {t:R`\(\approx0{,}816\)`, ok:1, fb:R`Se usa 0,062 como nueva prior: \(\frac{0{,}997\cdot0{,}0624}{0{,}015\cdot0{,}9376+0{,}997\cdot0{,}0624}=0{,}816\) (diap. 80).`},
  {t:R`\(0{,}124\)`, fb:R`Las probabilidades no se suman.`},
  {t:R`\(0{,}062\)`, fb:R`El segundo resultado sí aporta información.`},
  {t:R`\(0{,}997^2\)`, fb:R`Eso es \(\Pr(+,+|\text{sick})\), no la posterior.`}]},
 {id:'b10q3', q:R`Matriz de confusión TP = 16, FN = 30, FP = 10, TN = 144. ¿Cuál de estas métricas está bien calculada?`, opts:[
  {t:R`Recall \(=16/26\approx0{,}615\)`, fb:R`\(16/26\) es la precisión. Recall \(=16/46=0{,}348\).`},
  {t:R`Exactitud \(=160/200=0{,}80\)`, ok:1, fb:R`\((TP+TN)/N=(16+144)/200\). Engaña: el recall es solo 0,348 porque la clase positiva es minoritaria (23 %).`},
  {t:R`Especificidad \(=144/174\approx0{,}828\)`, fb:R`\(144/174\) es el VPN (\(TN/(TN+FN)\)). Especificidad \(=144/154=0{,}935\).`},
  {t:R`F1 \(=(0{,}615+0{,}348)/2\approx0{,}48\)`, fb:R`F1 es la media armónica: \(2PR/(P+R)=0{,}444\).`}]},
 {id:'b10q4', q:R`Al subir el umbral \(\gamma'\) (más exigente para decir «positivo»), en general…`, opts:[
  {t:R`…sube el recall y baja la precisión.`, fb:R`Al revés: detectas menos positivos.`},
  {t:R`…sube la precisión y baja el recall.`, ok:1, fb:R`Hay menos falsos positivos, pero también más falsos negativos (diap. 82).`},
  {t:R`…suben las dos.`, fb:R`Es un compromiso: no suben a la vez en general.`},
  {t:R`…no cambia nada.`, fb:R`El umbral define las regiones de decisión.`}]},
 {id:'b10q5', q:R`Según la diapositiva 84, ¿qué métrica importa más en un filtro de spam?`, opts:[
  {t:R`El recall: hay que detectar todo el spam.`, fb:R`Eso es lo prioritario en la detección de enfermedades.`},
  {t:R`La precisión: no se debe marcar como spam un correo importante.`, ok:1, fb:R`Un falso positivo (perder un correo bueno) es peor que dejar pasar algo de spam.`},
  {t:R`La exactitud siempre.`, fb:R`Con clases desequilibradas, la exactitud puede ser engañosa.`},
  {t:R`Ninguna: el spam no se evalúa.`, fb:R`Es uno de los ejemplos de la diapositiva.`}]},
 {id:'b10q6', q:R`Según la conclusión (diap. 85), ¿qué necesita cada regla?`, opts:[
  {t:R`MAP: pdf y priors; MBR: pdf, priors y costes; NP: solo pdf.`, ok:1, fb:R`Sus discriminantes son, respectivamente, la posterior, menos el riesgo condicional y la pdf.`},
  {t:R`Las tres necesitan las priors.`, fb:R`NP no las necesita.`},
  {t:R`MAP necesita costes y MBR no.`, fb:R`Al revés: los costes son lo que añade MBR.`},
  {t:R`NP necesita priors y costes.`, fb:R`Solo necesita las verosimilitudes y \(\alpha\).`}]}
]
