<title>MLEARN Feature Selection</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>/*{{KATEX_CSS}}*/</style>
<style>
/* Layout: cuaderno de estudio — índice fijo a la izquierda, columna de lectura de ~70ch, tarjetas solo para conceptos y laboratorios. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EBEFF5; --ink:#162030; --ink-2:#465265; --muted:#6A7487; --line:#D6DDE7;
  --accent:#0A66AD; --accent-ink:#FFFFFF; --accent-soft:#E2EEF8;
  --prof:#0E7A6C; --prof-soft:#E1F3EF; --trap:#A9520B; --trap-soft:#FCEFE1; --err:#B3261E; --err-soft:#FBE9E8;
  --link:#5B3FB0; --link-soft:#EEE9FA; --ok:#1C7A4B; --ok-soft:#E1F3E8; --bad:#B3261E; --bad-soft:#FBE9E8;
  --c1:#2563C9; --c2:#D9731A; --cw1:#C8323A; --cw2:#2563C9; --cmda:#7A45C9; --grid:#E3E8EF; --axis:#8994A6;
  --f-display:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --side:280px; --hdr:56px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#151C26; --surface-2:#1C2531; --ink:#E5E9EF; --ink-2:#B2BBC9; --muted:#8893A5; --line:#2A3442;
  --accent:#5BA8E6; --accent-ink:#08111C; --accent-soft:#132A3D;
  --prof:#58C3B1; --prof-soft:#10292A; --trap:#E3A15C; --trap-soft:#2B2116; --err:#F08A84; --err-soft:#2E1A1B;
  --link:#B29CF2; --link-soft:#221C38; --ok:#5CC28A; --ok-soft:#12291E; --bad:#F08A84; --bad-soft:#2E1A1B;
  --c1:#5B93EE; --c2:#C9772E; --cw1:#E5646A; --cw2:#5B93EE; --cmda:#A27BEA; --grid:#232D3A; --axis:#6F7A8C;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#151C26; --surface-2:#1C2531; --ink:#E5E9EF; --ink-2:#B2BBC9; --muted:#8893A5; --line:#2A3442;
  --accent:#5BA8E6; --accent-ink:#08111C; --accent-soft:#132A3D;
  --prof:#58C3B1; --prof-soft:#10292A; --trap:#E3A15C; --trap-soft:#2B2116; --err:#F08A84; --err-soft:#2E1A1B;
  --link:#B29CF2; --link-soft:#221C38; --ok:#5CC28A; --ok-soft:#12291E; --bad:#F08A84; --bad-soft:#2E1A1B;
  --c1:#5B93EE; --c2:#C9772E; --cw1:#E5646A; --cw2:#5B93EE; --cmda:#A27BEA; --grid:#232D3A; --axis:#6F7A8C;
  color-scheme:dark; }

*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hdr) + 12px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.katex{font-size:1.06em}
.katex-display{margin:.7em 0;overflow-x:auto;overflow-y:hidden;padding:.15em 0}

/* ---------- header ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:var(--hdr);display:flex;align-items:center;gap:14px;
  background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.hdr .menu{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:36px;cursor:pointer}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.brand span{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.hdr .grow{flex:1}
.tot{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tot .bar{width:120px}
.sync{font-size:11.5px;color:var(--muted);white-space:nowrap}
.theme-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .35s}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--hdr))}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));align-self:start;height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));overflow-y:auto;
  border-right:1px solid var(--line);background:var(--surface);padding:14px 12px 30px max(12px,env(safe-area-inset-left,0px))}
.side h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 8px 6px;font-weight:600}
.nav a{display:grid;grid-template-columns:26px 1fr;gap:2px 8px;align-items:center;padding:7px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--ink)}
.nav a .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center}
.nav a.on .n{color:var(--accent);font-weight:500}
.nav a .t{min-width:0}
.nav a .bar{grid-column:2;height:4px}
.nav a .meta{grid-column:2;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
main{min-width:0;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:820px;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* ---------- typography ---------- */
.eyebrow{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:var(--f-display);font-size:30px;line-height:1.15;margin:.2em 0 .35em;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-size:21px;line-height:1.25;margin:1.6em 0 .5em;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17.5px;line-height:1.3;margin:0;text-wrap:balance}
.lede{font-family:var(--f-text);font-size:17px;color:var(--ink-2);max-width:66ch}
.prose,.concept .summary,.deep-body,.note,.numex,.q-text,.fb,.ex-body{font-family:var(--f-text);font-size:16px;line-height:1.62}
.prose p,.concept p{margin:.55em 0;max-width:70ch}
.prose ul,.concept ul,.concept ol{padding-left:1.25em;margin:.5em 0}
.prose li,.concept li{margin:.25em 0}
strong{font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:.88em}
.small{font-size:13px;color:var(--muted);font-family:var(--f-ui)}
hr.sep{border:0;border-top:1px solid var(--line);margin:28px 0}

/* ---------- concept cards ---------- */
.concept{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:22px 0;overflow:hidden}
.concept>header{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px 6px;flex-wrap:wrap}
.cnum{font-family:var(--f-mono);font-size:13px;color:var(--accent);font-weight:500;margin-right:4px}
.concept>header .ref{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:6px;white-space:nowrap}
.concept .summary{padding:2px 18px 10px}
.concept .summary .tag{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:block;margin-top:4px}
.concept .inner{padding:0 18px}
details.deep{border-top:1px solid var(--line);background:var(--surface)}
details.deep>summary{cursor:pointer;list-style:none;padding:11px 18px;font-weight:600;font-size:14px;color:var(--accent);display:flex;align-items:center;gap:8px;user-select:none}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s;margin-right:2px}
details.deep[open]>summary::before{transform:rotate(45deg)}
.deep-body{padding:2px 18px 14px}
.concept>footer{display:flex;justify-content:flex-end;gap:10px;padding:10px 18px;border-top:1px solid var(--line);background:var(--surface-2)}
.mark{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:500}
.mark[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mark[aria-pressed="true"]::before{content:"✓ "}

/* notes */
.note{border-radius:8px;padding:10px 14px 10px 14px;margin:12px 0;border:1px solid var(--line);background:var(--surface-2);font-size:15px}
.note>.lab{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:3px}
.note.prof{background:var(--prof-soft);border-color:color-mix(in srgb,var(--prof) 35%,transparent)} .note.prof>.lab{color:var(--prof)}
.note.trap{background:var(--trap-soft);border-color:color-mix(in srgb,var(--trap) 35%,transparent)} .note.trap>.lab{color:var(--trap)}
.note.errata{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 35%,transparent)} .note.errata>.lab{color:var(--err)}
.note.link{background:var(--link-soft);border-color:color-mix(in srgb,var(--link) 35%,transparent)} .note.link>.lab{color:var(--link)}
.note p{margin:.35em 0}
.numex{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:12px 0;background:var(--surface)}
.numex>.lab{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2);margin-bottom:3px}

/* step-by-step derivations */
ol.steps{list-style:none;padding:0;margin:10px 0;counter-reset:st}
ol.steps>li{counter-increment:st;position:relative;padding:8px 0 8px 40px;border-top:1px dotted var(--line)}
ol.steps>li:first-child{border-top:0}
ol.steps>li::before{content:counter(st);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12.5px var(--f-ui);display:grid;place-items:center}
ol.steps>li.hid{display:none}
ol.steps>li.fresh{animation:fadein .35s ease}
@keyframes fadein{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ol.steps>li.fresh{animation:none}.bar i{transition:none}}
.stepbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.stepbar .cnt{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* tables */
.tbl{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px;font-family:var(--f-ui)}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:600;font-size:12.5px;letter-spacing:.02em}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}

/* section head */
.sec-head{margin-bottom:8px}
.sec-head .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.chip{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--ink-2);background:var(--surface)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.pager a.nx{text-align:right}
.pending{border:1px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--muted);background:var(--surface)}

/* ---------- viz ---------- */
.lab-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:22px 0;padding:16px 18px}
.lab-card>.hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.lab-card>.hd .eyebrow{color:var(--prof)}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 18px;margin:12px 0}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:13px}
.ctl label{display:flex;justify-content:space-between;gap:8px;color:var(--ink-2)}
.ctl label output{font-family:var(--f-mono);font-size:12px;color:var(--ink)}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl select{font:inherit;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer;font-size:12.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.plots{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.plot{position:relative;min-width:0}
.plot.wide{grid-column:1/-1}
.plot canvas{width:100%;display:block;border:1px solid var(--line);border-radius:8px;background:var(--surface);touch-action:none}
.plot .cap{font-size:12px;color:var(--muted);margin-top:4px}
.readout{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.readout .kv{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface-2);font-size:13px}
.readout .kv b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.dot{width:9px;height:9px;border-radius:50%}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;font-family:var(--f-mono);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;z-index:5}

/* ---------- quiz ---------- */
.quiz{margin:30px 0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.quiz>.qh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.quiz>.qh h3{font-size:16px}
.quiz .score{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.qitem{padding:16px 18px;border-bottom:1px solid var(--line)}
.qitem:last-child{border-bottom:0}
.q-num{font:600 11.5px var(--f-ui);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.q-text{margin:4px 0 10px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer;font-family:var(--f-text);font-size:15.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font:600 12px var(--f-mono);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-2);margin-top:1px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .l{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .l{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.opt .fb{display:none;grid-column:2;font-size:14.5px;color:var(--ink-2);border-top:1px dotted var(--line);padding-top:6px;margin-top:4px}
.qitem.done .opt .fb{display:block}
.fb b.v-ok{color:var(--ok)} .fb b.v-bad{color:var(--bad)}
.qitem.hidden-q{display:none}
.verdict{font:600 13px var(--f-ui);margin-top:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}

/* ---------- misc ---------- */
.map-grid .tbl td:nth-child(1),.map-grid .tbl td:nth-child(2){white-space:nowrap}
.hero{padding:6px 0 4px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.mini{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
.mini h4{margin:0 0 4px;font-family:var(--f-display);font-size:14.5px}
.mini p{margin:0;font-size:13.5px;color:var(--ink-2)}
kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* ---------- responsive ---------- */
@media (max-width: 900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .hdr .menu{display:grid;place-items:center}
  .side{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--hdr));left:0;bottom:0;width:min(86vw,320px);height:auto;z-index:45;transform:translateX(-102%);transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  body.nav-open .side{transform:none}
  .tot .bar{width:70px}
  .sync{display:none}
}
@media (max-width: 520px){
  h1{font-size:25px}
  .tot .bar{display:none}
  .theme-btn .tl{display:none}
  .brand{overflow:hidden} .brand b{overflow:hidden;text-overflow:ellipsis;font-size:14px}
  .hdr{gap:10px}
  .tot .lbl{display:none}
  .concept>header,.concept .summary,.deep-body,details.deep>summary,.concept>footer,.qitem,.quiz>.qh{padding-left:14px;padding-right:14px}
  .brand span{display:none}
}
@media print{
  .hdr,.side,.pager,.concept>footer,.stepbar,.quiz,.lab-card{display:none!important}
  .wrap{display:block} main{padding:0}
  ol.steps>li.hid{display:block!important}
  details.deep>*{display:block}
}
</style>
