 {id:'b1q1', q:R`Tienes \(N=50\) vectores de dimensión \(d=50\) y calculas \(\hat{\bC}=\frac1N\sum_k(\bx_k-\hat{\bmu})(\bx_k-\hat{\bmu})^T\). ¿Qué puedes asegurar?`, opts:[

 {id:'b2q5', q:R`La diap. 5 dice que demasiadas características empeoran el error; la diap. 9, que con \(d\to\infty\) el error tiende a 0. ¿Cómo se reconcilian?`, opts:[

 {id:'b2q6', q:R`\(\boldsymbol\delta=\bmu_1-\bmu_2=(1,1)^T\). Compara \(\bC=\mathbf I\) con \(\bC=\begin{pmatrix}1&0{,}8\\0{,}8&1\end{pmatrix}\). Con la covarianza correlada…`, opts:[

  {t:R`Los dos`, fb:R`PCA no las usa.`},
  {t:R`Ninguno`, fb:R`MDA sí las usa.`}]},
 {id:'b3q3', q:R`¿Cuál es el criterio con el que PCA elige \(\bW\)?`, opts:[
  {t:R`Minimizar el error cuadrático medio de reconstrucción de los \(\bx_k\).`, ok:1, fb:R`\(J=\sum_k\|\bW\bz_k+\balpha-\bx_k\|_2^2\) (diap. 14).`},
  {t:R`Maximizar la separación entre las clases proyectadas.`, fb:R`Ese es el criterio de MDA.`},
  {t:R`Minimizar directamente \(\Pr(e)\).`, fb:R`Ninguno de los dos lo hace; PCA ni siquiera conoce las clases.`},
  {t:R`Maximizar \(|\bW^T\bS_B\bW|/|\bW^T\bS_C\bW|\).`, fb:R`Es el criterio discriminante de MDA (diap. 33).`}]},
 {id:'b3q4', q:R`Diapositiva 11: si las filas de \(\bX\) son los vectores ya centrados y \(\bX=\bU_X\bGamma_X\bV^T\), las columnas de \(\bV\) son…`, opts:[
  {t:R`…los autovectores de \(\bS=\bX^T\bX\).`, ok:1, fb:R`\(\bX^T\bX=\bV(\bGamma_X^T\bGamma_X)\bV^T\): son las direcciones de PCA, con \(\lambda_j=s_j^2\).`},
  {t:R`…los autovectores de \(\bX\bX^T\).`, fb:R`Esos son las columnas de \(\bU_X\), vectores de \(\mathbb{R}^N\).`},
  {t:R`…las imágenes originales normalizadas.`, fb:R`Las imágenes son las filas de \(\bX\), no las columnas de \(\bV\).`},
  {t:R`…los autovectores generalizados de \(\bS_B\) y \(\bS_C\).`, fb:R`Eso es MDA; la SVD de \(\bX\) no usa clases.`}]},
 {id:'b3q5', q:R`Con \(\|\bw_j\|=1\), la componente \(z_{k,j}=\bw_j^T(\bx_k-\balpha)\) es…`, opts:[
  {t:R`…la coordenada de \(\bx_k-\balpha\) a lo largo de la dirección \(\bw_j\).`, ok:1, fb:R`Es la longitud con signo de la proyección de \(\bx_k-\balpha\) sobre la recta generada por \(\bw_j\).`},
  {t:R`…la distancia de \(\bx_k\) a \(\balpha\).`, fb:R`Eso sería \(\|\bx_k-\balpha\|\), que no depende de \(\bw_j\).`},
  {t:R`…la componente \(j\) de \(\bx_k\).`, fb:R`Solo si \(\bw_j=\mathbf e_j\) y \(\balpha=\mathbf 0\).`},
  {t:R`…el error de reconstrucción de \(\bx_k\).`, fb:R`El error es \(\bx_k-\hat{\bx}_k\), un vector de \(\mathbb{R}^d\).`}]}
],
b4: [
 {id:'b4q1', q:R`En PCA, las columnas de \(\bW\) son…`, opts:[
  {t:R`…los autovectores de \(\bS\) asociados a los \(d'\) mayores autovalores.`, ok:1, fb:R`Maximizan \(\tr(\bW^T\bS\bW)\) y, por tanto, minimizan \(J\) (diap. 15 y 20).`},
  {t:R`…los autovectores de \(\bS\) asociados a los \(d'\) menores autovalores.`, fb:R`Esos dan el máximo error: \(J\) sería la suma de los autovalores grandes.`},
  {t:R`…los autovectores generalizados de \(\bS_B\bw=\sigma\bS_C\bw\).`, fb:R`Eso es MDA (diap. 33); PCA no usa las clases.`},
  {t:R`…las \(d'\) características originales de mayor varianza.`, fb:R`PCA no selecciona características originales: las combina. Solo coincide si \(\bS\) es diagonal.`}]},
 {id:'b4q2', q:R`\(\bS\) (con \(d=4\)) tiene autovalores \(9,\ 4,\ 1,\ 0{,}5\). Con \(d'=2\), ¿cuánto vale \(J_{\min}\)?`, opts:[
  {t:R`\(1{,}5\)`, ok:1, fb:R`Suma de los autovalores descartados: \(1+0{,}5\).`},
  {t:R`\(13\)`, fb:R`Eso es lo conservado (\(9+4\)), no el error.`},
  {t:R`\(0{,}5\)`, fb:R`Solo el último; con \(d'=2\) se descartan dos autovalores.`},
  {t:R`\(14{,}5\)`, fb:R`Es \(\tr(\bS)\): el error con \(d'=0\).`}]},
 {id:'b4q3', q:R`¿Qué relación hay entre \(\bS\) y la covarianza insesgada \(\hat{\bC}=\frac{1}{N-1}\sum_k(\bx_k-\bm)(\bx_k-\bm)^T\)?`, opts:[
  {t:R`Tienen los mismos autovectores; los autovalores de \(\bS\) son \(N-1\) veces los de \(\hat{\bC}\).`, ok:1, fb:R`\(\bS=(N-1)\hat{\bC}\), y multiplicar por una constante positiva solo escala los autovalores (anotación de la diap. 15).`},
  {t:R`Tienen autovectores distintos; por eso PCA debe hacerse con \(\bS\).`, fb:R`Escalar una matriz no cambia sus autovectores: PCA con una u otra da las mismas direcciones.`},
  {t:R`Son la misma matriz.`, fb:R`Difieren en el factor \(N-1\).`},
  {t:R`\(\bS=\hat{\bC}/(N-1)\).`, fb:R`Al revés: \(\bS=(N-1)\hat{\bC}\).`}]},
 {id:'b4q4', q:R`Sobre el desplazamiento óptimo \(\balpha\) en PCA, ¿qué afirmación es correcta?`, opts:[
  {t:R`Cualquier \(\balpha=\bm+\bW\mathbf c\) es óptimo; \(\balpha=\bm\) es la elección natural y deja los \(\bz_k\) con media cero.`, ok:1, fb:R`La condición de óptimo es \((\mathbf I-\bP)(\bm-\balpha)=\mathbf 0\): \(\bm-\balpha\) debe estar en el espacio de columnas de \(\bW\).`},
  {t:R`\(\balpha=\bm\) solo si los datos son gaussianos.`, fb:R`La derivación no usa ninguna pdf.`},
  {t:R`Cualquier \(\balpha\) da el mismo \(J\).`, fb:R`Un \(\balpha\) con componente fuera del espacio de columnas de \(\bW\) aumenta \(J\).`},
  {t:R`\(\balpha=\mathbf 0\) siempre, porque la media se puede restar después.`, fb:R`Con \(\balpha=\mathbf 0\) el subespacio pasa por el origen y PCA se desvía hacia la media (diap. 24).`}]},
 {id:'b4q5', q:R`Maximizas \(\sum_{i=1}^{d'}\bw_i^T\bS\bw_i\) imponiendo solo \(\|\bw_i\|=1\), sin exigir \(\bw_i^T\bw_j=0\). Si \(\lambda_1>\lambda_2\), el máximo se alcanza con…`, opts:[
  {t:R`…todas las columnas iguales a \(\bw_1\), con valor \(d'\lambda_1\).`, ok:1, fb:R`Cada sumando se maximiza por separado con \(\bw_1\). Por eso hace falta \(\bW^T\bW=\mathbf I\), que viene de \(\bW=\bU_L\) (diap. 18).`},
  {t:R`…los \(d'\) autovectores principales, con valor \(\sum_{i\le d'}\lambda_i\).`, fb:R`Es la solución con columnas ortonormales; sin esa restricción, repetir \(\bw_1\) da más.`},
  {t:R`…nada: el problema no tiene máximo.`, fb:R`Con la norma fija, cada sumando está acotado por \(\lambda_1\).`},
  {t:R`…los \(d'\) autovectores de menor autovalor.`, fb:R`Eso minimiza la función, no la maximiza.`}]},
 {id:'b4q6', q:R`Los datos están lejos del origen y haces PCA con \(\sum_k\bx_k\bx_k^T\) en lugar de \(\bS\). El primer autovector tiende a…`, opts:[
  {t:R`…apuntar hacia la media \(\bm\), porque \(\sum_k\bx_k\bx_k^T=\bS+N\bm\bm^T\).`, ok:1, fb:R`El término de rango 1 \(N\bm\bm^T\) domina cuando \(\|\bm\|\) es grande (diap. 24, ejemplo 4).`},
  {t:R`…coincidir con el de \(\bS\), porque solo cambia una constante.`, fb:R`La diferencia \(N\bm\bm^T\) no es un múltiplo de la identidad: cambia los autovectores.`},
  {t:R`…ser el vector nulo.`, fb:R`Un autovector nunca es nulo.`},
  {t:R`…ser perpendicular a \(\bm\).`, fb:R`El término \(N\bm\bm^T\) empuja justo en la dirección de \(\bm\).`}]}
],
b5: [
 {id:'b5q1', q:R`Un problema con \(c=4\) clases y \(d=50\) características. ¿Cuántas características puede dar MDA como máximo?`, opts:[
  {t:R`\(3\)`, ok:1, fb:R`\(d'\le\min(d,c-1)=\min(50,3)=3\), porque \(\rank(\bS_B)\le c-1\).`},
  {t:R`\(4\)`, fb:R`Las \(c\) medias \(\bm_i-\bm\) son linealmente dependientes (\(\sum_iN_i(\bm_i-\bm)=\mathbf 0\)): solo generan \(c-1\) dimensiones.`},
  {t:R`\(50\)`, fb:R`Ese sería el límite de PCA, no el de MDA.`},
  {t:R`\(49\)`, fb:R`No depende de \(d-1\), sino de \(c-1\).`}]},
 {id:'b5q2', q:R`En la demostración de \(\bS_T=\bS_C+\bS_B\), los términos cruzados \(\sum_{\bx\in D_i}(\bx-\bm_i)(\bm_i-\bm)^T\) se anulan porque…`, opts:[
  {t:R`…\(\sum_{\bx\in D_i}(\bx-\bm_i)=\mathbf 0\), por definición de \(\bm_i\).`, ok:1, fb:R`\((\bm_i-\bm)^T\) no depende de \(\bx\) y sale del sumatorio; lo que queda es \(N_i\bm_i-N_i\bm_i=\mathbf 0\).`},
  {t:R`…\(\bm_i=\bm\) para todas las clases.`, fb:R`Si fuera así, \(\bS_B\) sería nula y no habría nada que separar.`},
  {t:R`…\(\bS_C\) es simétrica.`, fb:R`La simetría no hace cero ningún término.`},
  {t:R`…las clases son gaussianas.`, fb:R`La descomposición es puramente algebraica: vale para cualquier distribución.`}]},
 {id:'b5q3', q:R`Las columnas de la \(\bW\) de MDA son…`, opts:[
  {t:R`…los autovectores generalizados \(\bS_B\bw_j=\sigma_j\bS_C\bw_j\) de mayores \(\sigma_j\).`, ok:1, fb:R`Diap. 33: maximizan \(|\bW^T\bS_B\bW|/|\bW^T\bS_C\bW|\).`},
  {t:R`…los autovectores de \(\bS_T\) de mayores autovalores.`, fb:R`Eso es PCA, que mezcla la dispersión útil con la perjudicial.`},
  {t:R`…los autovectores de \(\bS_B\) de mayores autovalores.`, fb:R`Ignora la forma de las clases (\(\bS_C\)): con clases alargadas, falla.`},
  {t:R`…los autovectores de \(\bS_C\) de menores autovalores.`, fb:R`Haría las clases estrechas, pero sin mirar si sus medias quedan separadas.`}]},
 {id:'b5q4', q:R`Si \(\bW\) contiene \(d'\) autovectores generalizados, ¿cuánto vale \(\dfrac{|\bW^T\bS_B\bW|}{|\bW^T\bS_C\bW|}\)?`, opts:[
  {t:R`\(\prod_{i=1}^{d'}\sigma_i\)`, ok:1, fb:R`De \(\bW^T\bS_B\bW=(\bW^T\bS_C\bW)\bSigma\) y \(|\mathbf A\mathbf B|=|\mathbf A||\mathbf B|\) sale \(|\bSigma|\) (diap. 34).`},
  {t:R`\(\sum_{i=1}^{d'}\sigma_i\)`, fb:R`La suma sale con trazas; aquí hay determinantes, que dan productos.`},
  {t:R`\(\sigma_{\max}\)`, fb:R`Solo con \(d'=1\).`},
  {t:R`\(1\)`, fb:R`Eso pasaría si \(\bS_B=\bS_C\).`}]},
 {id:'b5q5', q:R`Dos clases (\(c=2\)). La dirección de MDA es…`, opts:[
  {t:R`…\(\bw\propto\bS_C^{-1}(\bm_1-\bm_2)\).`, ok:1, fb:R`\(\bS_B=\frac{N_1N_2}{N}(\bm_1-\bm_2)(\bm_1-\bm_2)^T\), así que \(\bS_B\bw\) siempre apunta hacia \(\bm_1-\bm_2\).`},
  {t:R`…\(\bw\propto\bm_1-\bm_2\), siempre.`, fb:R`Solo si \(\bS_C\propto\mathbf I\). Con clases alargadas hay que girarla con \(\bS_C^{-1}\).`},
  {t:R`…el autovector principal de \(\bS_T\).`, fb:R`Esa es la de PCA; en el ejemplo de la tarjeta 5.4 da separación nula.`},
  {t:R`…perpendicular a \(\bm_1-\bm_2\).`, fb:R`Sobre esa dirección las dos medias se proyectan en el mismo punto cuando \(\bS_C\propto\mathbf I\).`}]},
 {id:'b5q6', q:R`El ejercicio 4 usa la dispersión total \(\bS_T\) en el denominador en lugar de \(\bS_C\). ¿Qué cambia?`, opts:[
  {t:R`Nada en las direcciones: mismos autovectores, y los autovalores pasan a \(\frac{\sigma}{1+\sigma}\).`, ok:1, fb:R`\(\bS_B\bw=\sigma\bS_C\bw\iff\bS_B\bw=\frac{\sigma}{1+\sigma}\bS_T\bw\), usando \(\bS_T=\bS_C+\bS_B\). El orden de los autovalores se conserva.`},
  {t:R`Las direcciones cambian: hay que recalcular \(\bW\).`, fb:R`Los autovectores son exactamente los mismos.`},
  {t:R`Los autovalores pasan a ser \(\sigma+1\).`, fb:R`Pasan a \(\frac{\sigma}{1+\sigma}\), en \([0,1)\).`},
  {t:R`MDA se convierte en PCA.`, fb:R`PCA no usa \(\bS_B\) en absoluto.`}]}
],
b6: [
 {id:'b6q1', q:R`Según la diapositiva 39, t-SNE reduce la dimensionalidad…`, opts:[
  {t:R`…preservando las distancias entre vectores.`, ok:1, fb:R`Es la definición de la diapositiva. Con más precisión, conserva sobre todo las vecindades locales.`},
  {t:R`…maximizando la separación entre clases con sus etiquetas.`, fb:R`Eso es MDA; t-SNE no usa etiquetas.`},
  {t:R`…proyectando sobre los autovectores de \(\bS\).`, fb:R`Eso es PCA, que es lineal.`},
  {t:R`…eligiendo al azar \(d'\) características.`, fb:R`Eso recuerda a random forest (diap. 12).`}]},
 {id:'b6q2', q:R`En el ejemplo 8 (dígitos manuscritos), ¿qué muestran las dos visualizaciones en 2D?`, opts:[
  {t:R`Con t-SNE aparecen 10 grupos separados; con PCA la mayoría de los dígitos se solapan.`, ok:1, fb:R`Dos direcciones lineales de máxima dispersión no bastan para separar 10 clases complejas.`},
  {t:R`PCA separa mejor, porque es óptimo.`, fb:R`PCA es óptimo para reconstruir, no para separar clases.`},
  {t:R`Las dos son idénticas.`, fb:R`Son muy distintas: es el mensaje de la diapositiva.`},
  {t:R`t-SNE solo separa el 0 y el 1.`, fb:R`Al revés: en PCA solo el 0 y el 1 quedan en los extremos.`}]},
 {id:'b6q3', q:R`En un autoencoder, la representación reducida es…`, opts:[
  {t:R`…la capa central \(\bz\) (cuello de botella), de menor dimensión que la entrada.`, ok:1, fb:R`El codificador lleva \(\bx\) a \(\bz\); el decodificador intenta recuperar \(\bx\) desde \(\bz\).`},
  {t:R`…la salida \(\hat{\bx}\).`, fb:R`\(\hat{\bx}\) tiene la dimensión original: es la reconstrucción.`},
  {t:R`…la entrada \(\bx\).`, fb:R`Es lo que se quiere comprimir.`},
  {t:R`…las etiquetas de clase.`, fb:R`El autoencoder no usa etiquetas.`}]},
 {id:'b6q4', q:R`Un autoencoder lineal (sin funciones de activación) entrenado con error cuadrático de reconstrucción…`, opts:[
  {t:R`…reconstruye sobre el mismo subespacio que PCA.`, ok:1, fb:R`Su pérdida es exactamente el \(J\) de la diap. 14, cuyo óptimo es el subespacio de los \(d'\) autovectores principales.`},
  {t:R`…da la misma \(\bW\) que MDA.`, fb:R`No usa etiquetas, así que no puede reproducir MDA.`},
  {t:R`…no aprende nada útil.`, fb:R`Aprende el subespacio de PCA.`},
  {t:R`…necesita \(d'\le c-1\).`, fb:R`Esa limitación es de MDA.`}]}
],
b7: [
 {id:'b7q1', q:R`¿Cuál de estas afirmaciones es una conclusión de la diapositiva 43?`, opts:[
  {t:R`PCA no necesita las etiquetas \(y_k\) para reducir características.`, ok:1, fb:R`Es no supervisado: solo usa \(\bm\) y \(\bS\).`},
  {t:R`PCA garantiza la separación de clases.`, fb:R`La diapositiva dice justo lo contrario.`},
  {t:R`MDA no tiene ninguna limitación en el número de características.`, fb:R`Tiene \(d'\le\min(d,c-1)\).`},
  {t:R`Los métodos no lineales sustituyen siempre a PCA y MDA.`, fb:R`La diapositiva solo dice que existen otros métodos.`}]},
 {id:'b7q2', q:R`Dos clases separadas en una dirección de poca varianza total, y alargadas en otra. Con \(d'=1\), PCA…`, opts:[
  {t:R`…puede quedarse con la dirección del alargamiento y descartar justo la que separaba las clases.`, ok:1, fb:R`Es lo que pasa en la diap. 25 y en el ejemplo de la tarjeta 5.4.`},
  {t:R`…siempre conserva la dirección que separa las clases.`, fb:R`PCA no sabe qué separa las clases: no ve las etiquetas.`},
  {t:R`…da la misma dirección que MDA.`, fb:R`Solo coincide en casos particulares.`},
  {t:R`…no se puede aplicar.`, fb:R`Se puede aplicar siempre; el problema es el resultado.`}]},
 {id:'b7q3', q:R`Quieres guardar una base de imágenes ocupando menos y poder reconstruirlas. ¿Qué método encaja?`, opts:[
  {t:R`PCA`, ok:1, fb:R`Minimiza el error de reconstrucción y permite \(\hat{\bx}=\bW\bz+\bm\) (eigenfaces, diap. 22).`},
  {t:R`MDA`, fb:R`Su objetivo es separar clases, necesita etiquetas y da como mucho \(c-1\) características.`},
  {t:R`Ninguno de los dos permite reconstruir.`, fb:R`PCA sí.`},
  {t:R`t-SNE`, fb:R`No da una transformación que se pueda invertir para reconstruir.`}]},
 {id:'b7q4', q:R`¿Cómo se evita la limitación de MDA en el número de características, según el PDF?`, opts:[
  {t:R`Aplicando MDA sobre subconjuntos de características y concatenando los resultados.`, ok:1, fb:R`Diap. 35 y 43: con \(K\) grupos, \(d'=(c-1)K\).`},
  {t:R`Usando \(\bS_T\) en lugar de \(\bS_C\).`, fb:R`Cambia los autovalores, no su número: los autovectores son los mismos.`},
  {t:R`Inventando clases adicionales.`, fb:R`No es lo que propone el PDF.`},
  {t:R`Tomando también los autovectores con \(\sigma_j=0\).`, fb:R`Esos no aportan discriminación y anulan el criterio.`}]},
 {id:'b7q5', q:R`Una vez calculada la \(\bW\) de MDA, para transformar un vector nuevo \(\bx\) de clase desconocida…`, opts:[
  {t:R`…basta con \(\bz=\bW^T\bx\); las etiquetas solo hacían falta para calcular \(\bW\).`, ok:1, fb:R`Después se clasifica \(\bz\) con el detector bayesiano en \(\mathbb{R}^{d'}\) (diap. 37).`},
  {t:R`…hay que conocer su clase para elegir \(\bW\).`, fb:R`\(\bW\) es única para todas las clases.`},
  {t:R`…hay que recalcular \(\bS_B\) y \(\bS_C\) con él.`, fb:R`No: \(\bW\) se calcula una vez con el entrenamiento.`},
  {t:R`…no se puede: MDA solo transforma los datos de entrenamiento.`, fb:R`Eso le pasa a t-SNE, no a MDA.`}]}
]
};
</script>
