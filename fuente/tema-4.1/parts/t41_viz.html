<script>
/* ================= tema 4.1: utilidades ================= */
function qk(el, k){ return el.querySelector('[data-k="' + k + '"]'); }
function qo(el, k){ return el.querySelector('[data-o="' + k + '"]'); }
function showIf(el, attr, on){ el.querySelectorAll('[data-show="' + attr + '"]').forEach(c => { c.hidden = !on; }); }
function gauss2(r){ const u = Math.max(r(), 1e-12), v = r(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function lowerBound(a, x){ let lo = 0, hi = a.length; while (lo < hi){ const m = (lo + hi) >> 1; if (a[m] < x) lo = m + 1; else hi = m; } return lo; }
/* distancia k-ésima en 1D sobre datos ordenados */
function kthDist1D(sorted, x, k){
  let r = lowerBound(sorted, x), l = r - 1, d = 0;
  for (let c = 0; c < k; c++){
    const dl = l >= 0 ? x - sorted[l] : Infinity, dr = r < sorted.length ? sorted[r] - x : Infinity;
    if (dl <= dr){ d = dl; l--; } else { d = dr; r++; }
  }
  return d;
}
const ROOT2PI = Math.sqrt(2*Math.PI);

/* ================= laboratorio: densidad 1D (Parzen y KNN) ================= */
VIZ.dens = function(el){
  const NS = [1, 4, 16, 64, 256, 1024], M = 320, X0 = -0.6, X1 = 4.6, dx = (X1 - X0)/(M - 1);
  const cv = el.querySelector('canvas[data-c="1"]'), out = qo(el, 'out');
  const meth = qk(el, 'method'), nS = qk(el, 'n'), hS = qk(el, 'h'), kS = qk(el, 'k'), ks = qk(el, 'ksqrt'), xS = qk(el, 'x0'), mc = qk(el, 'mc'), re = qk(el, 're');
  if (el.dataset.mode) meth.value = el.dataset.mode;
  const ftrue = x => 0.6*Math.max(0, 1 - Math.abs(x - 1)) + ((x >= 3 && x <= 3.5) ? 0.8 : 0);
  let seed = 7;
  const sample = (n, r) => { const a = new Float64Array(n); for (let i = 0; i < n; i++) a[i] = r() < 0.6 ? r() + r() : 3 + 0.5*r(); return a.sort(); };
  const grid = Float64Array.from({length: M}, (_, i) => X0 + i*dx);
  function params(){
    const n = NS[+nS.value], m = meth.value;
    const h = (+hS.value)/Math.sqrt(n);
    const k = ks.checked ? Math.max(1, Math.round(Math.sqrt(n))) : Math.min(+kS.value, n);
    return {n, m, h, k};
  }
  function estimate(xs, P){
    const f = new Float64Array(M), n = xs.length;
    if (P.m === 'knn'){ for (let i = 0; i < M; i++){ const r = kthDist1D(xs, grid[i], P.k); f[i] = P.k/(n*2*Math.max(r, 1e-9)); } }
    else if (P.m === 'pb'){ for (let i = 0; i < M; i++){ const c = lowerBound(xs, grid[i] + P.h/2 + 1e-12) - lowerBound(xs, grid[i] - P.h/2); f[i] = c/(n*P.h); } }
    else { const h = P.h, cut = 5*h; for (let i = 0; i < M; i++){ const x = grid[i]; let s = 0; for (let j = lowerBound(xs, x - cut), J = lowerBound(xs, x + cut); j < J; j++){ const u = (x - xs[j])/h; s += Math.exp(-0.5*u*u); } f[i] = s/(n*h*ROOT2PI); } }
    return f;
  }
  function draw(){
    const P = params(), m = P.m, isK = m === 'knn';
    showIf(el, 'parzen', !isK); showIf(el, 'knn', isK); kS.disabled = ks.checked;
    qo(el, 'n').textContent = P.n; qo(el, 'h').textContent = fmt(+hS.value, 2) + ' → hₙ = ' + fmt(P.h, 3); qo(el, 'k').textContent = P.k; qo(el, 'x0').textContent = fmt(+xS.value, 2);
    const xs = sample(P.n, mulberry32(seed*7919 + P.n)), f = estimate(xs, P);
    let mean = null, sd = null, reps = 0;
    if (mc.checked){
      reps = P.n >= 256 ? 80 : 200; mean = new Float64Array(M); const s2 = new Float64Array(M);
      for (let r = 0; r < reps; r++){ const e = estimate(sample(P.n, mulberry32(1000 + r*31 + seed*101)), P); for (let i = 0; i < M; i++){ mean[i] += e[i]; s2[i] += e[i]*e[i]; } }
      sd = new Float64Array(M); for (let i = 0; i < M; i++){ mean[i] /= reps; sd[i] = Math.sqrt(Math.max(0, s2[i]/reps - mean[i]*mean[i])); }
    }
    const {ctx, w, h} = setupCanvas(cv), mg = {l:40, r:12, t:12, b:40}, YM = 1.3;
    const X = lin(X0, X1, mg.l, w - mg.r), Y = lin(0, YM, h - mg.b, mg.t);
    drawAxes(ctx, w, h, mg, X, Y, {yt:[0, .4, .8, 1.2], yf:v => fmt(v, 1), xt:[0, 1, 2, 3, 4], xl:'x'});
    const ink = cssv('--ink'), acc = cssv('--accent'), mut = cssv('--muted'), k3 = cssv('--cmda');
    ctx.save(); ctx.beginPath(); ctx.rect(mg.l, mg.t, w - mg.l - mg.r, h - mg.t - mg.b); ctx.clip();
    const x0 = +xS.value; let kin = 0, V = 0, lo = 0, hi = 0;
    if (isK){ const r = kthDist1D(xs, x0, P.k); lo = x0 - r; hi = x0 + r; V = 2*r; kin = P.k; }
    else if (m === 'pb'){ lo = x0 - P.h/2; hi = x0 + P.h/2; V = P.h; kin = lowerBound(xs, hi + 1e-12) - lowerBound(xs, lo); }
    else { lo = x0 - 2*P.h; hi = x0 + 2*P.h; V = P.h; for (let j = 0; j < xs.length; j++){ const u = (x0 - xs[j])/P.h; kin += Math.exp(-0.5*u*u)/ROOT2PI; } }
    if (m === 'pg'){ ctx.fillStyle = withAlpha(k3, .14); ctx.beginPath(); ctx.moveTo(X(lo), Y(0)); for (let t = 0; t <= 60; t++){ const x = lo + (hi - lo)*t/60, u = (x - x0)/P.h; ctx.lineTo(X(x), Y(Math.min(YM, 0.9*Math.exp(-0.5*u*u)))); } ctx.lineTo(X(hi), Y(0)); ctx.fill(); }
    else { ctx.fillStyle = withAlpha(k3, .14); ctx.fillRect(X(lo), mg.t, X(hi) - X(lo), h - mg.t - mg.b); }
    ctx.strokeStyle = k3; ctx.lineWidth = 1.5; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(X(x0) + .5, mg.t); ctx.lineTo(X(x0) + .5, h - mg.b); ctx.stroke(); ctx.setLineDash([]);
    if (mean){ ctx.fillStyle = withAlpha(acc, .16); ctx.beginPath(); for (let i = 0; i < M; i++) ctx.lineTo(X(grid[i]), Y(Math.min(YM, mean[i] + sd[i]))); for (let i = M - 1; i >= 0; i--) ctx.lineTo(X(grid[i]), Y(Math.max(0, mean[i] - sd[i]))); ctx.fill();
      ctx.strokeStyle = acc; ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); for (let i = 0; i < M; i++){ const y = Y(Math.min(YM, mean[i])); if (!i) ctx.moveTo(X(grid[i]), y); else ctx.lineTo(X(grid[i]), y); } ctx.stroke(); ctx.setLineDash([]); }
    ctx.strokeStyle = ink; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i < M; i++){ const y = Y(ftrue(grid[i])); if (!i) ctx.moveTo(X(grid[i]), y); else ctx.lineTo(X(grid[i]), y); } ctx.stroke();
    ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.beginPath(); for (let i = 0; i < M; i++){ const y = Y(Math.min(YM, f[i])); if (!i) ctx.moveTo(X(grid[i]), y); else ctx.lineTo(X(grid[i]), y); } ctx.stroke();
    ctx.restore();
    const step = Math.max(1, Math.floor(xs.length/400));
    for (let j = 0; j < xs.length; j += step){ const inside = xs[j] >= lo && xs[j] <= hi && m !== 'pg'; ctx.fillStyle = inside ? k3 : withAlpha(mut, .8); ctx.fillRect(X(xs[j]) - 1, h - mg.b - (inside ? 9 : 6), 2, inside ? 9 : 6); }
    let area = 0; for (let i = 0; i < M - 1; i++) area += 0.5*(f[i] + f[i + 1])*dx;
    const fx0 = isK ? P.k/(P.n*Math.max(V, 1e-9)) : (m === 'pb' ? kin/(P.n*V) : kin/(P.n*V));
    let s = '';
    s += isK ? `<span class="kv">k = <b>${P.k}</b> vecinos → V = 2·r_k = <b>${fmt(V, 3)}</b></span>` : `<span class="kv">${m === 'pg' ? 'k ponderado = Σφ' : 'k'} = <b>${fmt(kin, m === 'pg' ? 2 : 0)}</b> en V = hₙ = <b>${fmt(V, 3)}</b></span>`;
    s += `<span class="kv">fₙ(x₀) = k/(nV) = <b>${fmt(fx0, 3)}</b></span><span class="kv">f(x₀) real = <b>${fmt(ftrue(x0), 3)}</b></span>`;
    s += `<span class="kv">área bajo fₙ en [−0,6; 4,6] = <b>${fmt(area, 3)}</b>${isK ? ' (KNN no integra 1)' : ''}</span>`;
    if (mean){ const i0 = Math.round((x0 - X0)/dx); s += `<span class="kv">en x₀: sesgo = <b>${fmt(mean[i0] - ftrue(x0), 3)}</b>, σ = <b>${fmt(sd[i0], 3)}</b> (${reps} repeticiones)</span>`; }
    out.innerHTML = s;
  }
  [meth, nS, hS, kS, ks, xS, mc].forEach(c => c.addEventListener('input', draw));
  re.addEventListener('click', () => { seed++; draw(); });
  return {el, draw};
};

/* ================= laboratorio: KNN en 2D ================= */
VIZ.knn2d = function(el){
  const cv = el.querySelector('canvas[data-c="1"]'), out = qo(el, 'out');
  const dsS = qk(el, 'ds'), kS = qk(el, 'k'), mS = qk(el, 'metric'), vS = qk(el, 'vote'), syS = qk(el, 'sy'), stdC = qk(el, 'std'), re = qk(el, 're');
  let seed = 3, data = null, key = '', qx = 0.5, qy = 0.5;
  function gen(){
    const r = mulberry32(seed*977 + dsS.selectedIndex*13), P = [];
    const blob = (cx, cy, s, n, c) => { for (let i = 0; i < n; i++) P.push([cx + s*gauss2(r), cy + s*gauss2(r), c]); };
    const ds = dsS.value;
    if (ds === 'blobs'){ blob(0.36, 0.4, 0.09, 60, 0); blob(0.64, 0.6, 0.09, 60, 1); }
    else if (ds === 'overlap'){ blob(0.43, 0.45, 0.14, 70, 0); blob(0.57, 0.55, 0.14, 70, 1); }
    else if (ds === 'three'){ blob(0.3, 0.33, 0.085, 45, 0); blob(0.7, 0.33, 0.085, 45, 1); blob(0.5, 0.7, 0.085, 45, 2); }
    else { for (let i = 0; i < 70; i++){ const t = Math.PI*r(); P.push([0.3 + 0.22*Math.cos(t) + 0.035*gauss2(r), 0.45 + 0.22*Math.sin(t) + 0.035*gauss2(r), 0]); const u = Math.PI*r(); P.push([0.52 - 0.22*Math.cos(u) + 0.035*gauss2(r), 0.55 - 0.22*Math.sin(u) + 0.035*gauss2(r), 1]); } }
    return P.filter(p => p[0] > 0.01 && p[0] < 0.99 && p[1] > 0.01 && p[1] < 0.99);
  }
  function scales(){
    const S = Math.pow(10, +syS.value); let fx = 1, fy = S;
    if (stdC.checked){ const n = data.length; let mx = 0, my = 0; data.forEach(p => { mx += p[0]; my += p[1]*S; }); mx /= n; my /= n; let vx = 0, vy = 0; data.forEach(p => { vx += (p[0] - mx)**2; vy += (p[1]*S - my)**2; }); fx = 1/Math.sqrt(vx/(n - 1)); fy = S/Math.sqrt(vy/(n - 1)); }
    return {S, fx, fy};
  }
  const pnorm = (a, b, p) => p === 1 ? a + b : p === 2 ? Math.sqrt(a*a + b*b) : Math.max(a, b);
  function classify(x, y, sc, k, p, vote, skip){
    const n = data.length, d = new Float64Array(n), idx = new Uint16Array(n);
    for (let i = 0; i < n; i++){ d[i] = i === skip ? Infinity : pnorm(Math.abs((data[i][0] - x)*sc.fx), Math.abs((data[i][1] - y)*sc.fy), p); idx[i] = i; }
    idx.sort((a, b) => d[a] - d[b]);
    const nc = 3, votes = [0, 0, 0], cnt = [0, 0, 0];
    for (let j = 0; j < k; j++){ const i = idx[j], c = data[i][2]; cnt[c]++; votes[c] += vote === 'maj' ? 1 : vote === 'w1' ? 1/Math.max(d[i], 1e-9) : 1/Math.max(d[i]*d[i], 1e-12); }
    let best = 0; for (let c = 1; c < nc; c++) if (votes[c] > votes[best] + 1e-12) best = c;
    const tie = votes.filter(v => Math.abs(v - votes[best]) < 1e-12 && v > 0).length > 1;
    if (tie) best = data[idx[0]][2];
    return {best, votes, cnt, idx, d, r: d[idx[k - 1]], tie};
  }
  function draw(){
    const k0 = dsS.value + seed; if (k0 !== key){ data = gen(); key = k0; }
    const k = Math.min(+kS.value, data.length - 1), p = mS.value === 'inf' ? Infinity : +mS.value, vote = vS.value, sc = scales();
    qo(el, 'k').textContent = k; qo(el, 'sy').textContent = '×' + fmt(sc.S, sc.S < 10 ? 2 : 0).replace(/,00$/, '');
    const {ctx, w, h} = setupCanvas(cv), side = Math.min(w, h), ox = (w - side)/2;
    const X = v => ox + v*side, Y = v => h - v*side, iX = px => (px - ox)/side, iY = py => (h - py)/side;
    const cols = [cssv('--c1'), cssv('--c2'), cssv('--cmda')], surf = cssv('--surface'), ink = cssv('--ink');
    const cell = 6; ctx.save(); ctx.beginPath(); ctx.rect(ox, 0, side, h); ctx.clip();
    for (let py = 0; py < h; py += cell) for (let px = ox; px < ox + side; px += cell){
      const c = classify(iX(px + cell/2), iY(py + cell/2), sc, k, p, vote, -1).best;
      ctx.fillStyle = withAlpha(cols[c], .2); ctx.fillRect(px, py, cell, cell);
    }
    ctx.restore(); ctx.strokeStyle = cssv('--line'); ctx.strokeRect(ox + .5, .5, side - 1, h - 1);
    data.forEach(pt => { const c = pt[2]; ctx.beginPath(); if (c === 1){ ctx.rect(X(pt[0]) - 3.5, Y(pt[1]) - 3.5, 7, 7); } else if (c === 2){ ctx.moveTo(X(pt[0]), Y(pt[1]) - 4.5); ctx.lineTo(X(pt[0]) + 4, Y(pt[1]) + 3); ctx.lineTo(X(pt[0]) - 4, Y(pt[1]) + 3); ctx.closePath(); } else ctx.arc(X(pt[0]), Y(pt[1]), 3.6, 0, 7); ctx.fillStyle = cols[c]; ctx.fill(); });
    const Q = classify(qx, qy, sc, k, p, vote, -1);
    ctx.save(); ctx.strokeStyle = cols[2]; ctx.lineWidth = 2; ctx.fillStyle = withAlpha(cols[2], .1); ctx.beginPath();
    for (let t = 0; t <= 120; t++){ const a = 2*Math.PI*t/120, ux = Math.cos(a), uy = Math.sin(a), nn = pnorm(Math.abs(ux), Math.abs(uy), p); const dxp = Q.r*ux/nn/sc.fx, dyp = Q.r*uy/nn/sc.fy; if (!t) ctx.moveTo(X(qx + dxp), Y(qy + dyp)); else ctx.lineTo(X(qx + dxp), Y(qy + dyp)); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.strokeStyle = withAlpha(ink, .5); ctx.lineWidth = 1;
    for (let j = 0; j < k; j++){ const pt = data[Q.idx[j]]; ctx.beginPath(); ctx.moveTo(X(qx), Y(qy)); ctx.lineTo(X(pt[0]), Y(pt[1])); ctx.stroke(); ctx.beginPath(); ctx.arc(X(pt[0]), Y(pt[1]), 6, 0, 7); ctx.stroke(); }
    ctx.lineWidth = 2.5; ctx.strokeStyle = ink; ctx.beginPath(); ctx.moveTo(X(qx) - 6, Y(qy) - 6); ctx.lineTo(X(qx) + 6, Y(qy) + 6); ctx.moveTo(X(qx) - 6, Y(qy) + 6); ctx.lineTo(X(qx) + 6, Y(qy) - 6); ctx.stroke();
    let tr = 0, loo = 0; data.forEach((pt, i) => { if (classify(pt[0], pt[1], sc, k, p, vote, -1).best !== pt[2]) tr++; if (classify(pt[0], pt[1], sc, k, p, vote, i).best !== pt[2]) loo++; });
    const nc = dsS.value === 'three' ? 3 : 2, names = ['ω₁', 'ω₂', 'ω₃'];
    let s = `<span class="kv">en x: ${Array.from({length: nc}, (_, c) => `k${'₁₂₃'[c]} = <b>${Q.cnt[c]}</b>`).join(', ')}${vote !== 'maj' ? ' · pesos ' + Array.from({length: nc}, (_, c) => fmt(Q.votes[c], 1)).join(' / ') : ''} → <b>${names[Q.best]}</b>${Q.tie ? ' (empate: decide el más cercano)' : ''}</span>`;
    s += `<span class="kv">error de entrenamiento = <b>${fmt(100*tr/data.length, 1)} %</b></span><span class="kv">error dejando uno fuera = <b>${fmt(100*loo/data.length, 1)} %</b></span>`;
    if (sc.S > 1 && !stdC.checked) s += `<span class="kv">el eje vertical pesa ×${fmt(sc.S, 0)} en la distancia</span>`;
    out.innerHTML = s;
  }
  cv.addEventListener('click', e => { const b = cv.getBoundingClientRect(), w = b.width, h = b.height, side = Math.min(w, h), ox = (w - side)/2; qx = Math.min(1, Math.max(0, (e.clientX - b.left - ox)/side)); qy = Math.min(1, Math.max(0, (h - (e.clientY - b.top))/side)); draw(); });
  [dsS, kS, mS, vS, syS, stdC].forEach(c => c.addEventListener('input', draw));
  re.addEventListener('click', () => { seed++; draw(); });
  return {el, draw};
};

/* ================= laboratorio: forma de la distancia ================= */
VIZ.dist = function(el){
  const cv = el.querySelector('canvas[data-c="1"]'), out = qo(el, 'out');
  const kind = qk(el, 'kind'), pS = qk(el, 'p'), rS = qk(el, 'rho'), sS = qk(el, 's2'), kS = qk(el, 'k');
  const PS = [1, 1.5, 2, 3, 4, Infinity], r = mulberry32(41), pts = [];
  for (let t = 0; pts.length < 14 && t < 5000; t++){ const a = 2*Math.PI*r(), rad = 0.25 + 0.7*Math.sqrt(r()), x = rad*Math.cos(a), y = rad*Math.sin(a); if (pts.every(q => Math.hypot(q[0] - x, q[1] - y) > 0.24)) pts.push([x, y, String.fromCharCode(65 + pts.length)]); }
  function dfun(){
    if (kind.value === 'p'){ const p = PS[+pS.value]; return (x, y) => p === Infinity ? Math.max(Math.abs(x), Math.abs(y)) : Math.pow(Math.pow(Math.abs(x), p) + Math.pow(Math.abs(y), p), 1/p); }
    const rho = +rS.value, s2 = +sS.value, c11 = 1, c12 = rho*s2, c22 = s2*s2, det = c11*c22 - c12*c12, i11 = c22/det, i12 = -c12/det, i22 = c11/det;
    return (x, y) => Math.sqrt(Math.max(0, i11*x*x + 2*i12*x*y + i22*y*y));
  }
  function draw(){
    const isP = kind.value === 'p'; showIf(el, 'p', isP); showIf(el, 'maha', !isP);
    const p = PS[+pS.value]; qo(el, 'p').textContent = p === Infinity ? '∞' : fmt(p, p % 1 ? 1 : 0); qo(el, 'rho').textContent = fmt(+rS.value, 2); qo(el, 's2').textContent = fmt(+sS.value, 2);
    const k = +kS.value; qo(el, 'k').textContent = k;
    const D = dfun(), d = pts.map(q => D(q[0], q[1])), order = d.map((_, i) => i).sort((a, b) => d[a] - d[b]), rk = d[order[k - 1]];
    const E = (x, y) => Math.sqrt(x*x + y*y), dE = pts.map(q => E(q[0], q[1])), ordE = dE.map((_, i) => i).sort((a, b) => dE[a] - dE[b]);
    const {ctx, w, h} = setupCanvas(cv), side = Math.min(w, h) - 10, cx = w/2, cy = h/2, sc = side/2.3;
    const X = v => cx + v*sc, Y = v => cy - v*sc, k3 = cssv('--cmda'), ink = cssv('--ink'), mut = cssv('--muted'), c1 = cssv('--c1');
    ctx.strokeStyle = cssv('--grid'); ctx.beginPath(); ctx.moveTo(X(-1.1), cy + .5); ctx.lineTo(X(1.1), cy + .5); ctx.moveTo(cx + .5, Y(-1.1)); ctx.lineTo(cx + .5, Y(1.1)); ctx.stroke();
    ctx.save(); ctx.strokeStyle = k3; ctx.lineWidth = 2; ctx.fillStyle = withAlpha(k3, .1); ctx.beginPath();
    for (let t = 0; t <= 240; t++){ const a = 2*Math.PI*t/240, ux = Math.cos(a), uy = Math.sin(a), nn = D(ux, uy); const x = rk*ux/nn, y = rk*uy/nn; if (!t) ctx.moveTo(X(x), Y(y)); else ctx.lineTo(X(x), Y(y)); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    const sel = new Set(order.slice(0, k)), selE = new Set(ordE.slice(0, k));
    pts.forEach((q, i) => { const on = sel.has(i); ctx.beginPath(); ctx.arc(X(q[0]), Y(q[1]), on ? 6 : 4.5, 0, 7); ctx.fillStyle = on ? k3 : withAlpha(mut, .85); ctx.fill(); label(ctx, q[2], X(q[0]) + 8, Y(q[1]) - 8, on ? k3 : mut); });
    ctx.lineWidth = 2.5; ctx.strokeStyle = ink; ctx.beginPath(); ctx.moveTo(cx - 6, cy - 6); ctx.lineTo(cx + 6, cy + 6); ctx.moveTo(cx - 6, cy + 6); ctx.lineTo(cx + 6, cy - 6); ctx.stroke();
    const names = order.slice(0, k).map(i => `${pts[i][2]} (${fmt(d[i], 3)})`).join(', ');
    const inn = [...sel].filter(i => !selE.has(i)).map(i => pts[i][2]), outn = [...selE].filter(i => !sel.has(i)).map(i => pts[i][2]);
    let s = `<span class="kv">${k} más cercanos a × : <b>${names}</b></span>`;
    s += (inn.length ? `<span class="kv">respecto a la euclídea entran <b>${inn.join(', ')}</b> y salen <b>${outn.join(', ')}</b></span>` : `<span class="kv">mismos vecinos que con la euclídea</span>`);
    out.innerHTML = s;
  }
  [kind, pS, rS, sS, kS].forEach(c => c.addEventListener('input', draw));
  return {el, draw};
};

/* ================= laboratorio: elegir k ================= */
VIZ.kcv = function(el){
  const cv1 = el.querySelector('canvas[data-c="1"]'), cv2 = el.querySelector('canvas[data-c="2"]'), out = qo(el, 'out');
  const kS = qk(el, 'k'), sS = qk(el, 'sep'), re = qk(el, 're');
  let seed = 5, key = '', T = null, Vd = null, trIdx = null, vaIdx = null, errT = null, errV = null;
  const KMAX = 99;
  function gen(n, sep, r){ const P = []; for (let i = 0; i < n; i++){ const c = i % 2; P.push([(c ? sep/2 : -sep/2) + gauss2(r), gauss2(r), c]); } return P; }
  function nnIdx(A, B){ return A.map(a => { const d = B.map(b => (a[0] - b[0])**2 + (a[1] - b[1])**2), idx = d.map((_, i) => i); idx.sort((x, y) => d[x] - d[y]); return Uint16Array.from(idx.slice(0, KMAX)); }); }
  function errs(A, idxs){ const e = new Float64Array(KMAX + 1); for (let k = 1; k <= KMAX; k += 2){ let wrong = 0; A.forEach((a, i) => { let v = 0; for (let j = 0; j < k; j++) v += T[idxs[i][j]][2]; const c = v*2 > k ? 1 : 0; if (c !== a[2]) wrong++; }); e[k] = wrong/A.length; } return e; }
  function prep(){
    const sep = +sS.value, k0 = seed + ':' + sep; if (k0 === key) return; key = k0;
    const r = mulberry32(seed*313); T = gen(200, sep, r); Vd = gen(1000, sep, mulberry32(seed*313 + 7));
    trIdx = nnIdx(T, T); vaIdx = nnIdx(Vd, T); errT = errs(T, trIdx); errV = errs(Vd, vaIdx);
  }
  function draw(){
    prep(); const k = +kS.value, sep = +sS.value; qo(el, 'k').textContent = k; qo(el, 'sep').textContent = 'separación ' + fmt(sep, 1);
    const bayes = Qf(sep/2), c1 = cssv('--c1'), c2 = cssv('--c2'), mut = cssv('--muted'), ink = cssv('--ink');
    { const {ctx, w, h} = setupCanvas(cv1), L = Math.max(3, sep/2 + 3), sx = w/(2*L), sy = h/6, cell = 6;
      const X = v => w/2 + v*sx, Y = v => h/2 - v*sy;
      for (let py = 0; py < h; py += cell) for (let px = 0; px < w; px += cell){ const x = (px + cell/2 - w/2)/sx, y = (h/2 - py - cell/2)/sy;
        const d = T.map(t => (t[0] - x)**2 + (t[1] - y)**2), idx = d.map((_, i) => i); idx.sort((a, b) => d[a] - d[b]); let v = 0; for (let j = 0; j < k; j++) v += T[idx[j]][2];
        ctx.fillStyle = withAlpha(v*2 > k ? c2 : c1, .2); ctx.fillRect(px, py, cell, cell); }
      T.forEach(t => { ctx.beginPath(); if (t[2]) ctx.rect(X(t[0]) - 3, Y(t[1]) - 3, 6, 6); else ctx.arc(X(t[0]), Y(t[1]), 3.2, 0, 7); ctx.fillStyle = t[2] ? c2 : c1; ctx.fill(); });
      label(ctx, `k = ${k}`, 8, 12, ink);
    }
    { const {ctx, w, h} = setupCanvas(cv2), mg = {l:44, r:12, t:12, b:36}; const ymax = Math.max(0.5, ...Array.from(errV).filter((v, i) => i % 2) ) ;
      const X = lin(1, KMAX, mg.l, w - mg.r), Y = lin(0, Math.min(0.6, ymax + 0.05), h - mg.b, mg.t);
      drawAxes(ctx, w, h, mg, X, Y, {yt:[0, .1, .2, .3, .4, .5].filter(v => v <= Math.min(0.6, ymax + 0.05)), yf:v => fmt(v, 1), xt:[1, 25, 50, 75, 99], xl:'k'});
      ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = mut; ctx.beginPath(); ctx.moveTo(mg.l, Y(bayes)); ctx.lineTo(w - mg.r, Y(bayes)); ctx.stroke(); ctx.restore();
      const line = (e, col) => { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); let f = true; for (let kk = 1; kk <= KMAX; kk += 2){ if (f){ ctx.moveTo(X(kk), Y(e[kk])); f = false; } else ctx.lineTo(X(kk), Y(e[kk])); } ctx.stroke(); };
      line(errT, c2); line(errV, c1);
      ctx.strokeStyle = ink; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(k) + .5, mg.t); ctx.lineTo(X(k) + .5, h - mg.b); ctx.stroke(); ctx.setLineDash([]);
      dot(ctx, X(k), Y(errV[k]), 4, c1, cssv('--surface')); dot(ctx, X(k), Y(errT[k]), 4, c2, cssv('--surface'));
    }
    let best = 1; for (let kk = 1; kk <= KMAX; kk += 2) if (errV[kk] < errV[best]) best = kk;
    out.innerHTML = `<span class="kv">con k = ${k}: entrenamiento <b>${fmt(100*errT[k], 1)} %</b>, validación <b>${fmt(100*errV[k], 1)} %</b></span><span class="kv">mejor k en validación = <b>${best}</b> (${fmt(100*errV[best], 1)} %)</span><span class="kv">error de Bayes = Q(sep/2) = <b>${fmt(100*bayes, 1)} %</b></span>`;
  }
  kS.addEventListener('input', draw); sS.addEventListener('input', draw); re.addEventListener('click', () => { seed++; draw(); });
  return {el, draw};
};
</script>
